function fmtEUR(n){ return Math.round(n).toLocaleString('es-ES') + ' €'; }
function fmtPct(n){ return (Math.round(n*10)/10).toString().replace('.',',') + '%'; }
function num(v){ if(v===null||v===undefined) return null; let s=String(v).trim(); if(s==='') return null; s=s.replace('€','').replace('$','').replace(/\s/g,''); if(s.includes(',')&&s.includes('.')){ s=s.replace(/\./g,'').replace(',','.'); } else if(s.includes(',')){ s=s.replace(',','.'); } const n=parseFloat(s); return isNaN(n)?null:n; }

function investedOf(p){ const v = num(p.invested); return v!==null ? v : 0; }
function commissionOf(p){ const v = num(p.commission); return v!==null ? v : 0; }
function currentValueOf(p){
  const inv = investedOf(p), price = num(p.price), cur = p.current_price_eur;
  if(price && cur && price>0){ return (inv/price)*cur; }
  return inv;
}
function gainPctOf(p){
  const price = num(p.price), cur = p.current_price_eur;
  if(price && cur && price>0) return (cur-price)/price*100;
  return null;
}
function computeTotals(){
  let invested=0, value=0, withData=0, commission=0;
  portfolio.positions.forEach(p => { invested+=investedOf(p); value+=currentValueOf(p); commission+=commissionOf(p); if(investedOf(p)>0) withData++; });
  return {invested, value, gain: value-invested, gainPct: invested>0 ? (value-invested)/invested*100 : 0, withData, total: portfolio.positions.length, commission};
}

function computeCAGR(totals){
  const withDate = portfolio.positions.filter(p=>p.date && investedOf(p)>0);
  if(!withDate.length || totals.invested<=0) return {days:0, value:null};
  const earliest = withDate.reduce((min,p)=>p.date<min?p.date:min, withDate[0].date);
  const days = Math.max(1, Math.round((new Date() - new Date(earliest+'T00:00:00')) / 86400000));
  if(days < 30 || totals.value<=0) return {days, value:null};
  const ratio = totals.value/totals.invested;
  return {days, value: (Math.pow(ratio, 365/days) - 1) * 100};
}

function computeConcentration(totals){
  let maxVal=0, maxName=null;
  portfolio.positions.forEach(p=>{
    const v = currentValueOf(p);
    if(v>maxVal){ maxVal=v; maxName=p.name; }
  });
  return {pct: totals.value>0 ? maxVal/totals.value*100 : 0, name:maxName};
}

function effectiveHistory(){
  // Además de los snapshots guardados, arrancamos la curva en la fecha de
  // compra más antigua: ese día, por definición, valor = invertido (0 de
  // ganancia), sin necesidad de precios históricos.
  const withDate = portfolio.positions.filter(p => p.date && investedOf(p) > 0);
  const combined = history.slice();
  if(withDate.length){
    const earliest = withDate.reduce((min, p) => p.date < min ? p.date : min, withDate[0].date);
    if(!combined.some(h => h.date === earliest)){
      const investedAtEarliest = withDate.filter(p => p.date === earliest).reduce((a, p) => a + investedOf(p), 0);
      combined.push({date: earliest, invested: Math.round(investedAtEarliest), value: Math.round(investedAtEarliest)});
    }
  }
  combined.sort((a, b) => a.date.localeCompare(b.date));
  return combined;
}

function breakdownByWeight(keyFn){
  // Reparto de TODA la cartera (las 45 posiciones) según su peso objetivo,
  // no solo de lo que ya se ha invertido -- así se ve el diseño completo.
  const map = {};
  portfolio.positions.forEach(p=>{
    const w = p.target_weight || 0;
    if(w<=0) return;
    const k = keyFn(p);
    map[k] = (map[k]||0) + w;
  });
  return map;
}

function fundedDetail(keyFn){
  const map = {};
  portfolio.positions.forEach(p=>{
    if(investedOf(p)<=0) return;
    const k = keyFn(p);
    if(!map[k]) map[k] = {count:0, names:[]};
    map[k].count++;
    map[k].names.push(p.name);
  });
  return map;
}

  let entries = Object.entries(breakdown).sort((a,b)=>b[1]-a[1]);
  if(entries.length===0){
    return `<div style="font-size:10.5px;color:var(--text-faint);height:100%;display:flex;align-items:center;">Sin datos todavía.</div>`;
  }
  let mergedOthers = null;
  if(entries.length > maxSlices){
    const head = entries.slice(0,maxSlices-1);
    const tail = entries.slice(maxSlices-1);
    const restSum = tail.reduce((a,[,v])=>a+v,0);
    mergedOthers = tail.map(([k])=>k);
    entries = [...head, ['__otros__', restSum]];
  }
  const colorOf = (key) => key==='__otros__' ? '#6E7177' : colorFor(key);
  const fundedOf = (key) => key==='__otros__'
    ? (mergedOthers||[]).reduce((a,k)=>a+(funded[k]?funded[k].count:0), 0)
    : (funded[key] ? funded[key].count : 0);
  const namesOf = (key) => key==='__otros__'
    ? (mergedOthers||[]).flatMap(k=>funded[k]?funded[k].names:[])
    : (funded[key] ? funded[key].names : []);
  const total = entries.reduce((a,e)=>a+e[1],0);
  const size=94, cx=size/2, cy=size/2, r=size/2-2, inner=r*0.56;
  let svgInner;
  if(entries.length===1){
    const key = entries[0][0];
    svgInner = `<circle cx="${cx}" cy="${cy}" r="${(r+inner)/2}" fill="none" stroke="${colorOf(key)}" stroke-width="${r-inner}" class="div-slice" data-type="${filterType}" data-key="${key}" style="cursor:${key==='__otros__'?'default':'pointer'};"><title>${labelFor(key)}${fundedOf(key)?' · '+fundedOf(key)+' comprada(s): '+namesOf(key).join(', '):''}</title></circle>`;
  } else {
    let angle = -90;
    svgInner = entries.map(([key,val])=>{
      const frac = val/total;
      const sweep = frac*360;
      const large = sweep>180?1:0;
      const a0 = angle*Math.PI/180, a1=(angle+sweep)*Math.PI/180;
      const x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0);
      const x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
      const ix0=cx+inner*Math.cos(a0), iy0=cy+inner*Math.sin(a0);
      const ix1=cx+inner*Math.cos(a1), iy1=cy+inner*Math.sin(a1);
      const color = colorOf(key);
      const fc = fundedOf(key);
      angle += sweep;
      return `<path d="M ${x0} ${y0} A ${r} ${r} 0 ${large} 1 ${x1} ${y1} L ${ix1} ${iy1} A ${inner} ${inner} 0 ${large} 0 ${ix0} ${iy0} Z" fill="${color}" stroke="var(--panel)" stroke-width="1" class="div-slice" data-type="${filterType}" data-key="${key}" style="cursor:${key==='__otros__'?'default':'pointer'};"><title>${labelFor(key)}${fc?' · '+fc+' comprada(s): '+namesOf(key).join(', '):''}</title></path>`;
    }).join('');
  }
  const legend = entries.map(([key,val])=>{
    const pct = Math.round(val/total*100);
    const color = colorOf(key);
    const label = key==='__otros__' ? 'Otros' : labelFor(key);
    const fc = fundedOf(key);
    const names = namesOf(key);
    const isActive = diversificationFilter && diversificationFilter.type===filterType && diversificationFilter.key===key;
    return `<div class="div-slice" data-type="${filterType}" data-key="${key}" title="${fc?fc+' comprada(s): '+names.join(', ').replace(/"/g,'&quot;'):''}" style="cursor:${key==='__otros__'?'default':'pointer'};display:flex;align-items:center;gap:5px;font-size:10px;color:var(--text-dim);white-space:nowrap;${isActive?`background:var(--accent-soft);border-radius:4px;padding:1px 3px;margin:-1px -3px;`:''}">
      <span style="width:7px;height:7px;border-radius:50%;background:${color};flex-shrink:0;"></span>
      <span style="overflow:hidden;text-overflow:ellipsis;">${label}</span>
      ${fc ? `<span style="flex-shrink:0;background:var(--panel-2);color:var(--text);border-radius:8px;padding:0 5px;font-size:8.5px;font-weight:600;">${fc}</span>` : ''}
      <span style="margin-left:auto;color:var(--text-faint);flex-shrink:0;">${pct}%</span>
    </div>`;
  }).join('');
  return `<div style="display:flex;gap:10px;align-items:center;height:100%;">
    <svg viewBox="0 0 ${size} ${size}" style="width:auto;height:100%;max-width:45%;flex-shrink:0;">${svgInner}</svg>
    <div style="flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:center;gap:3px;overflow:hidden;">${legend}</div>
  </div>`;
}

function drawChart(){
  const hist = effectiveHistory();
  if(hist.length < 1) return '<div style="font-size:12px;color:var(--text-faint);">Sin snapshots todavía. Se guarda uno automáticamente en cuanto haya cambios.</div>';
  if(hist.length === 1){
    const pt = hist[0];
    const gain = pt.value - pt.invested;
    return `<div style="display:flex;align-items:center;gap:16px;height:100%;">
      <div style="width:12px;height:12px;border-radius:50%;background:var(--accent);flex-shrink:0;box-shadow:0 0 0 5px var(--accent-soft);"></div>
      <div>
        <div style="font-family:'Calibri','Carlito',sans-serif;font-size:20px;">${fmtEUR(pt.value)} <span style="font-size:13px;font-family:'Calibri','Carlito',sans-serif;color:${gain>=0?'var(--green)':'var(--red)'};">${gain>=0?'+':''}${fmtEUR(gain)}</span></div>
        <div style="font-size:11px;color:var(--text-faint);margin-top:3px;">Solo hay un snapshot guardado (${pt.date}). Se irán guardando automáticamente en días distintos según haya cambios, para que aquí aparezca la curva de evolución.</div>
      </div>
    </div>`;
  }
  const w=1100,h=190,padL=56,padR=12,padT=14,padB=24;
  const vals = hist.map(pt=>pt.value), invs = hist.map(pt=>pt.invested);
  const all = vals.concat(invs);
  const min=Math.min.apply(null,all), max=Math.max.apply(null,all);
  const range=(max-min)||Math.max(min,1)*0.1||1;
  const lo = min-range*0.1, hi = max+range*0.1, r2=(hi-lo)||1;
  const x = i => padL + (hist.length<=1?0:(i/(hist.length-1))*(w-padL-padR));
  const y = v => h-padB - ((v-lo)/r2)*(h-padT-padB);
  const lv = hist.map((pt,i)=>(i===0?'M':'L')+x(i)+','+y(pt.value)).join(' ');
  const li = hist.map((pt,i)=>(i===0?'M':'L')+x(i)+','+y(pt.invested)).join(' ');
  const area = lv + ` L${x(hist.length-1)},${h-padB} L${x(0)},${h-padB} Z`;
  const dots = hist.map((pt,i)=>`<circle cx="${x(i)}" cy="${y(pt.value)}" r="3" fill="#5B8DEF"/>`).join('');

  const yTickN = 5;
  const yGrid = Array.from({length:yTickN}, (_,i) => {
    const v = min + (max-min)*i/(yTickN-1);
    const yy = y(v);
    return `<line x1="${padL}" y1="${yy}" x2="${w-padR}" y2="${yy}" stroke="#26282D" stroke-width="1"/>
      <text x="${padL-8}" y="${yy+3}" font-size="9.5" fill="#6E7177" font-family="Calibri,Carlito,sans-serif" text-anchor="end">${fmtEUR(v)}</text>`;
  }).join('');

  const xTickN = Math.min(7, hist.length);
  const xIdx = xTickN<=1 ? [0] : Array.from({length:xTickN}, (_,i)=>Math.round(i*(hist.length-1)/(xTickN-1)));
  const xGrid = [...new Set(xIdx)].map(i => {
    const xx = x(i);
    return `<line x1="${xx}" y1="${padT}" x2="${xx}" y2="${h-padB}" stroke="#212327" stroke-width="1"/>
      <text x="${xx}" y="${h-6}" font-size="9.5" fill="#6E7177" font-family="Calibri,Carlito,sans-serif" text-anchor="middle">${hist[i].date.slice(5)}</text>`;
  }).join('');

  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:100%;display:block;">
    <defs><linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5B8DEF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#5B8DEF" stop-opacity="0"/>
    </linearGradient></defs>
    ${xGrid}
    ${yGrid}
    <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${h-padB}" stroke="#2D2F35" stroke-width="1"/>
    <path d="${area}" fill="url(#areaFill)"/>
    <path d="${li}" fill="none" stroke="#6E7177" stroke-width="1.3" stroke-dasharray="4,3"/>
    <path d="${lv}" fill="none" stroke="#5B8DEF" stroke-width="2.2"/>
    ${dots}
  </svg>`;
}

function drawPriceChart(points, p){
  const w=560,h=170,padL=56,padR=14,padT=12,padB=22;
  // yfinance devuelve el precio en divisa nativa; lo pasamos a EUR con el tipo
  // de cambio de hoy (el mismo que usa current_price_eur) para poder comparar
  // visualmente con el precio de compra, que el usuario introduce en EUR.
  const fx = (p.current_price_eur && p.current_price) ? p.current_price_eur / p.current_price : null;
  const toEur = c => fx ? c*fx : c;
  const seriesVals = points.map(pt=>toEur(pt.c));
  const buyPrice = fx ? num(p.price) : null;
  const allVals = seriesVals.concat(buyPrice!==null && buyPrice!==undefined ? [buyPrice] : []);
  const min=Math.min.apply(null,allVals), max=Math.max.apply(null,allVals);
  const range=(max-min)||Math.max(min,1)*0.05||1;
  const lo=min-range*0.12, hi=max+range*0.12, r2=(hi-lo)||1;
  const x = i => padL + (points.length<=1?0:(i/(points.length-1))*(w-padL-padR));
  const y = v => h-padB - ((v-lo)/r2)*(h-padT-padB);
  const line = points.map((pt,i)=>(i===0?'M':'L')+x(i)+','+y(seriesVals[i])).join(' ');
  const area = line + ` L${x(points.length-1)},${h-padB} L${x(0)},${h-padB} Z`;
  const up = seriesVals[seriesVals.length-1] >= seriesVals[0];
  const color = up ? '#4ADE80' : '#F87171';
  const fmtLabel = (iso) => {
    const d = new Date(iso);
    if(modalRange==='dia' || modalRange==='semana') return d.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit'}) + ' ' + d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
    if(modalRange==='anio') return d.toLocaleDateString('es-ES',{month:'short',year:'2-digit'});
    return d.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit'});
  };
  const fmtPrice = v => v.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2}) + (fx?' €':'');
  const buyLine = buyPrice!==null && buyPrice!==undefined && !isNaN(buyPrice)
    ? `<line x1="${padL}" y1="${y(buyPrice)}" x2="${w-padR}" y2="${y(buyPrice)}" stroke="#5B8DEF" stroke-width="1.2" stroke-dasharray="4,3"/>
       <text x="${w-padR}" y="${y(buyPrice)-4}" font-size="9.5" fill="#9DBBFF" font-family="Calibri,Carlito,sans-serif" text-anchor="end">tu compra: ${fmtPrice(buyPrice)}</text>`
    : '';

  const yTickN = 5;
  const yGrid = Array.from({length:yTickN}, (_,i) => {
    const v = min + (max-min)*i/(yTickN-1);
    const yy = y(v);
    return `<line x1="${padL}" y1="${yy}" x2="${w-padR}" y2="${yy}" stroke="#26282D" stroke-width="1"/>
      <text x="${padL-8}" y="${yy+3}" font-size="9" fill="#6E7177" font-family="Calibri,Carlito,sans-serif" text-anchor="end">${fmtPrice(v)}</text>`;
  }).join('');

  const xTickN = Math.min(6, points.length);
  const xIdx = xTickN<=1 ? [0] : Array.from({length:xTickN}, (_,i)=>Math.round(i*(points.length-1)/(xTickN-1)));
  const xGrid = [...new Set(xIdx)].map(i => {
    const xx = x(i);
    return `<line x1="${xx}" y1="${padT}" x2="${xx}" y2="${h-padB}" stroke="#212327" stroke-width="1"/>
      <text x="${xx}" y="${h-6}" font-size="8.5" fill="#6E7177" font-family="Calibri,Carlito,sans-serif" text-anchor="middle">${fmtLabel(points[i].t)}</text>`;
  }).join('');

  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:100%;display:block;">
    <defs><linearGradient id="areaFillModal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    ${xGrid}
    ${yGrid}
    <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${h-padB}" stroke="#2D2F35" stroke-width="1"/>
    <path d="${area}" fill="url(#areaFillModal)"/>
    ${buyLine}
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2"/>
    <circle cx="${x(points.length-1)}" cy="${y(seriesVals[seriesVals.length-1])}" r="3" fill="${color}"/>
  </svg>`;
}

async function loadModalChart(ticker, range){
  const token = ++modalChartToken;
  modalChartState = {loading:true, error:null, points:null};
  try{
    const res = await callEdgeFunction('ticker-history', {ticker, range});
    if(token !== modalChartToken) return;
    if(res.ok) modalChartState = {loading:false, error: res.points.length>1 ? null : 'Sin datos suficientes.', points: res.points};
    else modalChartState = {loading:false, error: res.error || 'Error al consultar Yahoo Finance.', points:null};
  } catch(e){
    if(token !== modalChartToken) return;
    modalChartState = {loading:false, error:'Error de conexión.', points:null};
  }
  render(currentScenario);
}

async function loadModalCompanyInfo(pos){
  const token = ++modalCompanyToken;
  try{
    const res = await callEdgeFunction('company-info', {ticker: pos.ticker});
    if(token !== modalCompanyToken) return;
    if(res.ok && res.summary){
      modalCompanyState = {loading:false, error:null, summary:res.summary, source:res.source};
      pos.business_summary = res.summary;
      pos.business_summary_source = res.source;
      await updatePositionField(pos.id, 'business_summary', res.summary);
      await updatePositionField(pos.id, 'business_summary_source', res.source);
    } else {
      modalCompanyState = {loading:false, error:'Sin descripción disponible.', summary:null};
    }
  } catch(e){
    if(token !== modalCompanyToken) return;
    modalCompanyState = {loading:false, error:'Error de conexión.', summary:null};
  }
  render(currentScenario);
}

async function loadPortfolioId(){
  if(!session) return null;
  const { data, error } = await supabase.from('portfolios').select('id,name').eq('owner_id', session.user.id).is('deleted_at', null).order('created_at').limit(1).maybeSingle();
  if(error){ console.error(error); return null; }
  if(data) activePortfolioName = data.name;
  return data ? data.id : null;
}

async function loadPortfolios(){
  if(!session){ portfolios = []; return; }
  const { data, error } = await supabase.from('portfolios').select('*').eq('owner_id', session.user.id).is('deleted_at', null).order('created_at');
  if(error){ console.error(error); return; }
  portfolios = data || [];
}

async function loadProfile(){
  const { data, error } = await supabase.from('profiles').select('*').maybeSingle();
  if(error){ console.error(error); return; }
  profile = data || {};
}

async function loadAll(){
  portfolioId = portfolioId || await loadPortfolioId();
  await loadPortfolios();
  if(!portfolioId){ portfolio = {positions:[]}; history = []; return; }
  const [{ data: rows, error: posErr }, { data: histRows, error: histErr }] = await Promise.all([
    supabase.from('positions').select('*').eq('portfolio_id', portfolioId).is('deleted_at', null),
    supabase.from('history').select('date,invested,value').eq('portfolio_id', portfolioId).order('date'),
  ]);
  if(posErr) console.error(posErr);
  if(histErr) console.error(histErr);
  portfolio = { positions: (rows||[]).map(r => ({ ...r, date: r.purchase_date })) };
  history = histRows || [];
}

async function updatePositionField(id, field, value){
  const { error } = await supabase.from('positions').update({ [dbField(field)]: value }).eq('id', id);
  if(error){ console.error(error); return false; }
  return true;
}

let isDirty = false;
function markDirty(){ isDirty = true; }

async function autoUpdateQuotes(){
  if(!portfolioId) return;
  const { data, error } = await supabase.functions.invoke('bulk-quotes');
  if(currentScreen !== 'portfolio' || !portfolioId) return;
  await loadAll();
  if(!error) showStatus(`Cotizaciones actualizadas (${data.updated}/${data.total}).`, 3000);
  render(currentScenario);
}

async function saveSnapshotIfDirty(){
  if(!isDirty || currentScreen !== 'portfolio' || !portfolioId) return;
  const totals = computeTotals();
  const today = new Date().toISOString().slice(0,10);
  const { error } = await supabase.from('history').upsert(
    { portfolio_id: portfolioId, date: today, invested: Math.round(totals.invested), value: Math.round(totals.value) },
    { onConflict: 'portfolio_id,date' }
  );
  if(!error){
    isDirty = false;
    await loadAll();
    render(currentScenario);
  }
}
setInterval(saveSnapshotIfDirty, 60000);

function renderTableChunk(rows, scenario){
  const sc = SCENARIOS.find(s=>s.key===scenario);
  let lastSector = null;
  return `<table class="postable">
    <colgroup><col style="width:12px;"><col style="width:84px;"><col><col style="width:62px;"><col style="width:54px;"></colgroup>
    <thead><tr><th></th><th>Ticker</th><th>Nombre</th><th style="text-align:right;">Invertido</th><th style="text-align:${scenario?'center':'right'};">${scenario?'Impacto':'Gan. %'}</th></tr></thead>
    <tbody>
      ${rows.map(p=>{
        const gp = gainPctOf(p);
        const inv = investedOf(p);
        const sens = SENS[p.sector] || {};
        const resp = sc ? sectorResponse(sens, sc.f) : null;
        const gainCell = resp
          ? `<span style="display:inline-block;min-width:18px;padding:1px 7px;border-radius:9px;background:${RESP[resp].color};color:#14151A;font-family:'Calibri','Carlito',sans-serif;font-weight:700;font-size:10.5px;" title="${RESP[resp].label}">${RESP[resp].sign}</span>`
          : (gp===null ? `<span style="color:var(--text-faint);">—</span>` : `<span style="color:${gp>=0?'var(--green)':'var(--red)'};font-family:'Calibri','Carlito',sans-serif;">${gp>=0?'+':''}${Math.round(gp)}%</span>`);
        let sectorHead = '';
        if(p.sector !== lastSector){
          lastSector = p.sector;
          sectorHead = `<tr class="sector-head"><td colspan="5">${p.sector}</td></tr>`;
        }
        const rowBg = resp==='pos' ? 'var(--green-soft)' : resp==='neg' ? 'var(--red-soft)' : '';
        const rowBorderLeft = resp==='pos' ? '3px solid var(--green)' : resp==='neg' ? '3px solid var(--red)' : '3px solid transparent';
        return `${sectorHead}<tr data-id="${p.id}" style="${rowBg?`background:${rowBg};`:''}border-left:${rowBorderLeft};">
          <td><span style="width:6px;height:6px;border-radius:50%;background:${MARKET[p.market]?.color||'#6E7177'};display:inline-block;"></span></td>
          <td style="font-family:'Calibri','Carlito',sans-serif;color:var(--text-dim);">${p.ticker||''}</td>
          <td>${p.name}</td>
          <td style="text-align:right;font-family:'Calibri','Carlito',sans-serif;color:${inv>0?'var(--text)':'var(--text-faint)'};">${inv>0?fmtEUR(inv):'—'}</td>
          <td style="text-align:${resp?'center':'right'};">${gainCell}</td>
        </tr>`;
      }).join('')}
    </tbody>
  </table>`;
}

function renderPositionsTable(scenario){
  let positions = portfolio.positions;
  if(diversificationFilter){
    positions = positions.filter(p => diversificationFilter.type==='market' ? p.market===diversificationFilter.key : p.sector===diversificationFilter.key);
  }
  const sorted = [...positions].sort((a,b)=> a.sector.localeCompare(b.sector,'es') || a.name.localeCompare(b.name,'es'));
  const chunkSize = Math.ceil(sorted.length/3);
  const chunks = [sorted.slice(0,chunkSize), sorted.slice(chunkSize,chunkSize*2), sorted.slice(chunkSize*2)];
  return `<div class="pf-table-chunks" style="flex:1;min-height:0;display:flex;gap:18px;overflow-y:auto;">
    ${chunks.map(chunk=>renderTableChunk(chunk, scenario)).join('')}
  </div>`;
}

let dialogState = null; // {type:'prompt'|'confirm', title, message, placeholder, defaultValue, danger, confirmLabel, error, onConfirm}

  dialogState = { type:'prompt', title, placeholder, defaultValue, onConfirm, error:null, maxLength:opts.maxLength, allowEmpty:opts.allowEmpty, confirmLabel:opts.confirmLabel };
  render(currentScenario);
}

  dialogState = { type:'confirm', title, message, danger:opts.danger, confirmLabel:opts.confirmLabel||'Confirmar', onConfirm, error:null };
  render(currentScenario);
}

      <h3 style="font-family:'Calibri','Carlito',sans-serif;font-size:15px;font-weight:600;margin:0 0 10px;">${dialogState.title}</h3>
      ${dialogState.message ? `<div style="font-size:12.5px;color:var(--text-dim);margin-bottom:14px;line-height:1.5;">${dialogState.message}</div>` : ''}

      ${dialogState.maxLength ? `<div id="dialog-counter" style="font-size:10px;color:var(--text-faint);text-align:right;margin-top:4px;">${(dialogState.defaultValue||'').length}/${dialogState.maxLength}</div>` : ''}
      <div style="margin-bottom:${dialogState.maxLength?'6px':'14px'};"></div>` : '<div style="margin-bottom:6px;"></div>'}

function wireDialog(app){
  const input = document.getElementById('dialog-input');
  if(input){
    input.addEventListener('keydown', (e) => { if(e.key==='Enter'){ e.preventDefault(); document.getElementById('dialog-confirm').click(); } });
    const counter = document.getElementById('dialog-counter');
    if(counter) input.addEventListener('input', () => { counter.textContent = `${input.value.length}/${dialogState.maxLength}`; });
  }
  const cancelBtn = document.getElementById('dialog-cancel');
  if(cancelBtn) cancelBtn.addEventListener('click', () => { dialogState = null; render(currentScenario); });
  const confirmBtn = document.getElementById('dialog-confirm');
  if(confirmBtn) confirmBtn.addEventListener('click', async () => {
    if(dialogState.type === 'prompt'){
      const value = document.getElementById('dialog-input').value.trim();
      if(!value && !dialogState.allowEmpty){ dialogState.error = 'Escribe un valor.'; render(currentScenario); return; }
      const cb = dialogState.onConfirm;
      dialogState = null;
      await cb(value);
    } else {
      const cb = dialogState.onConfirm;
      dialogState = null;
      await cb();
    }
  });
  const backdrop = document.getElementById('dialog-backdrop');
  if(backdrop) backdrop.addEventListener('click', (e) => { if(e.target===backdrop){ dialogState = null; render(currentScenario); } });
}

function wireAddPositionModal(app){
  const tickerInput = document.getElementById('addpos-ticker');
  if(!tickerInput) return;

  const closeBtn = document.getElementById('addpos-close');
  if(closeBtn) closeBtn.addEventListener('click', () => { addPositionOpen = false; render(currentScenario); });
  const cancelBtn = document.getElementById('addpos-cancel');
  if(cancelBtn) cancelBtn.addEventListener('click', () => { addPositionOpen = false; render(currentScenario); });
  const backdrop = document.getElementById('addpos-backdrop');
  if(backdrop) backdrop.addEventListener('click', (e) => { if(e.target===backdrop){ addPositionOpen = false; render(currentScenario); } });

  const suggestionsBox = document.getElementById('addpos-suggestions');
  let searchTimer = null;
  tickerInput.addEventListener('input', () => {
    addPositionSelected = null;
    const q = tickerInput.value.trim();
    if(searchTimer) clearTimeout(searchTimer);
    if(q.length < 2){ suggestionsBox.innerHTML = ''; return; }
    searchTimer = setTimeout(async () => {
      const token = ++addPositionSearchToken;
      suggestionsBox.innerHTML = `<div style="padding:8px 10px;font-size:11.5px;color:var(--text-faint);">Buscando…</div>`;
      let results = [];
      try {
        const res = await callEdgeFunction('ticker-search', {q});
        results = (res && res.ok) ? res.results : [];
      } catch(e){ results = null; }
      if(token !== addPositionSearchToken) return;
      if(results === null){ suggestionsBox.innerHTML = `<div style="padding:8px 10px;font-size:11.5px;color:var(--text-faint);">Error al buscar.</div>`; return; }
      if(!results.length){ suggestionsBox.innerHTML = `<div style="padding:8px 10px;font-size:11.5px;color:var(--text-faint);">Sin resultados.</div>`; return; }
      suggestionsBox.innerHTML = results.map((r,i) => `<button type="button" class="ticker-suggestion" data-idx="${i}">
        <b>${r.symbol}</b> — ${r.name}${r.exchange?` <span style="color:var(--text-faint);">(${r.exchange})</span>`:''}
      </button>`).join('');
      suggestionsBox.querySelectorAll('.ticker-suggestion').forEach(btn => btn.addEventListener('mousedown', (e) => {
        e.preventDefault();
        const r = results[Number(btn.getAttribute('data-idx'))];
        addPositionSelected = r;
        tickerInput.value = r.symbol;
        const nameInput = document.getElementById('addpos-name');
        if(nameInput && !nameInput.value.trim()) nameInput.value = r.name;
        const marketSelect = document.getElementById('addpos-market');
        if(marketSelect){ const m = marketForTicker(r.symbol, r.exchange); if(m) marketSelect.value = m; }
        suggestionsBox.innerHTML = '';
      }));
    }, 300);
  });
  tickerInput.addEventListener('blur', () => {
    setTimeout(() => { if(suggestionsBox) suggestionsBox.innerHTML = ''; }, 150);
  });

  const submitBtn = document.getElementById('addpos-submit');
  if(submitBtn) submitBtn.addEventListener('click', async () => {
    const ticker = tickerInput.value.trim().toUpperCase();
    const name = document.getElementById('addpos-name').value.trim();
    const market = document.getElementById('addpos-market').value;
    const sector = document.getElementById('addpos-sector').value;
    const tier = document.getElementById('addpos-tier').value;
    const cluster = document.getElementById('addpos-cluster').value.trim();
    const invested = num(document.getElementById('addpos-invested').value);
    const price = num(document.getElementById('addpos-price').value);
    const commission = num(document.getElementById('addpos-commission').value);
    const date = document.getElementById('addpos-date').value;
    const horizon = document.getElementById('addpos-horizon').value.trim();

    if(!name){ addPositionError = 'Falta el nombre.'; render(currentScenario); return; }
    if(!market){ addPositionError = 'Elige un mercado.'; render(currentScenario); return; }
    if(!sector){ addPositionError = 'Elige un sector.'; render(currentScenario); return; }
    if(invested===null || invested<=0){ addPositionError = 'Indica el importe invertido.'; render(currentScenario); return; }

    const row = {
      id: crypto.randomUUID(),
      portfolio_id: portfolioId,
      name,
      ticker: ticker || null,
      market,
      sector,
      cluster: cluster || null,
      tier: tier || null,
      invested,
      price,
      commission,
      purchase_date: date || null,
      horizon: horizon || null,
      currency: currencyForTicker(ticker),
    };
    const { error } = await supabase.from('positions').insert(row);
    if(error){ addPositionError = 'Error al guardar — revisa la conexión.'; render(currentScenario); return; }
    addPositionOpen = false;
    markDirty();
    await loadAll();
    showStatus(`Posición "${name}" añadida.`);
    render(currentScenario);
  });
}

async function goHome(){
  currentScreen = 'home';
  selectedId = null;
  diversificationFilter = null;
  await loadPortfolios();
  render(null);
}

function wireMenu(app){
  const menuBtn = document.getElementById('menu-btn');
  if(menuBtn) menuBtn.addEventListener('click', (e) => { e.stopPropagation(); menuOpen = !menuOpen; render(currentScenario); });
  if(menuOpen){
    document.addEventListener('click', function closeMenuOnce(){ menuOpen = false; render(currentScenario); document.removeEventListener('click', closeMenuOnce); }, { once:true });
  }
  const logoBtn = document.getElementById('logo-home-btn');
  if(logoBtn) logoBtn.addEventListener('click', async (e) => { e.stopPropagation(); await goHome(); });
  app.querySelectorAll('.nav-item').forEach(btn=>btn.addEventListener('click', async (e) => {
    e.stopPropagation();
    const view = btn.getAttribute('data-view');
    menuOpen = false;
    if(view === 'carteras'){
      await goHome();
    } else {
      activeView = view;
      if(view === 'explorar'){
        exploreDetailId = null; exploreDetailPositions = null; exploreLoading = true;
        render(currentScenario);
        await loadExploreList();
        render(currentScenario);
      } else {
        render(currentScenario);
      }
    }
  }));
  const menuLogoutBtn = document.getElementById('menu-logout-btn');
  if(menuLogoutBtn) menuLogoutBtn.addEventListener('click', async (e) => { e.stopPropagation(); await supabase.auth.signOut(); });
}

function renderHomeScreen(){
  if(!session) return; // una operación asíncrona pendiente terminó después de cerrar sesión; no repintar la app
  const app = document.getElementById('app');
  app.innerHTML = `<div class="home-wrap" style="height:100vh;overflow-y:auto;box-sizing:border-box;padding:16px 32px 32px;">
    <div style="max-width:1040px;margin:0 auto;">
      ${topNavBar()}
      <div style="margin-bottom:26px;">
        <h1 style="font-family:'Calibri','Carlito',sans-serif;font-weight:600;font-size:26px;margin:0;">Mis carteras</h1>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;">
        ${portfolios.map(p => `
          <div class="home-portfolio-card" data-id="${p.id}" style="position:relative;cursor:pointer;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:22px;display:flex;flex-direction:column;">
            <button class="home-portfolio-menu-btn" data-id="${p.id}" title="Opciones" style="position:absolute;top:12px;right:10px;cursor:pointer;background:none;border:none;color:var(--text-faint);font-size:16px;line-height:1;padding:6px;border-radius:6px;">⋮</button>
            ${openCardMenu===p.id ? `<div class="home-portfolio-menu" style="position:absolute;top:38px;right:10px;background:var(--panel);border:1px solid var(--border);border-radius:8px;box-shadow:0 12px 32px rgba(0,0,0,0.25);min-width:160px;z-index:40;overflow:hidden;">
              <button class="home-portfolio-rename" data-id="${p.id}" data-name="${p.name}" style="display:block;width:100%;text-align:left;cursor:pointer;background:none;border:none;border-bottom:1px solid var(--border-soft);color:var(--text);padding:9px 12px;font-size:12px;">Editar nombre</button>
              <button class="home-portfolio-describe" data-id="${p.id}" data-description="${(p.description||'').replace(/"/g,'&quot;')}" style="display:block;width:100%;text-align:left;cursor:pointer;background:none;border:none;border-bottom:1px solid var(--border-soft);color:var(--text);padding:9px 12px;font-size:12px;">Editar descripción</button>
              <button class="home-portfolio-delete" data-id="${p.id}" data-name="${p.name}" style="display:block;width:100%;text-align:left;cursor:pointer;background:none;border:none;color:var(--red);padding:9px 12px;font-size:12px;">Eliminar</button>
            </div>` : ''}
            <div style="font-size:15px;font-weight:600;padding-right:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:8px;">${p.name}</div>
            <div style="font-size:12px;color:var(--text-faint);line-height:1.4;min-height:32px;">${p.description ? p.description : '<span style="opacity:.5;">Sin descripción</span>'}</div>
            <div style="display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid var(--border-soft);">
              <span style="font-size:10.5px;color:var(--text-faint);">Compartir con otros</span>
              <button class="home-portfolio-share-btn" data-id="${p.id}" data-shared="${p.shared?'1':'0'}" style="cursor:pointer;font-size:10.5px;font-weight:700;padding:3px 11px;border-radius:10px;border:1px solid ${p.shared?'var(--accent-border)':'var(--border)'};background:${p.shared?'var(--accent-soft)':'var(--panel-2)'};color:${p.shared?'var(--accent-text)':'var(--text-faint)'};">${p.shared?'Sí':'No'}</button>
            </div>
            <div style="font-size:11.5px;color:var(--text-faint);margin-top:auto;padding-top:14px;">Abrir cartera →</div>
          </div>`).join('')}
        <div id="home-create-card" style="cursor:pointer;background:var(--panel-2);border:1.5px dashed var(--accent-border);border-radius:14px;padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:120px;">
          <div style="font-size:24px;color:var(--accent-text);margin-bottom:4px;line-height:1;">+</div>
          <div style="font-size:13px;color:var(--accent-text);font-weight:600;">${portfolios.length===0 ? 'Crear mi primera cartera' : 'Crear cartera'}</div>
        </div>
      </div>
    </div>
    ${renderViewOverlay()}
    ${renderDialog()}
    ${renderStatusToast()}
  </div>`;

  wireMenu(app);
  wireDialog(app);

  app.querySelectorAll('.home-portfolio-card').forEach(card=>card.addEventListener('click', async (e) => {
    if(e.target.closest('.home-portfolio-menu-btn, .home-portfolio-menu, .home-portfolio-share-btn')) return;
    const id = card.getAttribute('data-id');
    const target = portfolios.find(p=>p.id===id);
    portfolioId = id;
    activePortfolioName = target ? target.name : 'Mi cartera';
    currentScreen = 'portfolio';
    selectedId = null;
    diversificationFilter = null;
    document.getElementById('app').innerHTML = 'Cargando…';
    await loadAll();
    render(null);
    autoUpdateQuotes();
  }));

  app.querySelectorAll('.home-portfolio-menu-btn').forEach(btn=>btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const id = btn.getAttribute('data-id');
    openCardMenu = openCardMenu === id ? null : id;
    render(currentScenario);
  }));

  if(openCardMenu){
    document.addEventListener('click', function closeCardMenu(e){
      if(!e.target.closest('.home-portfolio-menu, .home-portfolio-menu-btn')){
        openCardMenu = null;
        document.removeEventListener('click', closeCardMenu);
        render(currentScenario);
      }
    });
  }

  app.querySelectorAll('.home-portfolio-rename').forEach(btn=>btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const id = btn.getAttribute('data-id'), name = btn.getAttribute('data-name');
    openCardMenu = null;
    askPrompt('Editar nombre', 'Nombre de la cartera', async (value) => {
      await supabase.from('portfolios').update({ name: value }).eq('id', id);
      if(portfolioId === id) activePortfolioName = value;
      await loadPortfolios();
      render(null);
    }, name);
  }));

  app.querySelectorAll('.home-portfolio-describe').forEach(btn=>btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const id = btn.getAttribute('data-id'), description = btn.getAttribute('data-description');
    openCardMenu = null;
    askPrompt('Editar descripción', 'Descripción breve de la cartera', async (value) => {
      await supabase.from('portfolios').update({ description: value || null }).eq('id', id);
      await loadPortfolios();
      render(null);
    }, description, { maxLength:60, allowEmpty:true, confirmLabel:'Guardar' });
  }));

  app.querySelectorAll('.home-portfolio-share-btn').forEach(btn=>btn.addEventListener('click', async (e) => {
    e.stopPropagation();
    const id = btn.getAttribute('data-id');
    const nextShared = btn.getAttribute('data-shared') !== '1';
    await supabase.from('portfolios').update({ shared: nextShared }).eq('id', id);
    await loadPortfolios();
    render(null);
  }));

  app.querySelectorAll('.home-portfolio-delete').forEach(btn=>btn.addEventListener('click', (e) => {
    e.stopPropagation();
    openCardMenu = null;
    if(portfolios.length <= 1){ showStatus('No puedes eliminar tu única cartera.'); render(currentScenario); return; }
    const id = btn.getAttribute('data-id'), name = btn.getAttribute('data-name');
    askConfirm('Eliminar cartera', `¿Eliminar "${name}"? Sus posiciones dejarán de verse (se puede recuperar más adelante).`, async () => {
      const target = portfolios.find(p=>p.id===id);
      if(target) await supabase.from('deleted_items_log').insert({ item_type:'portfolio', item_id:id, snapshot:target });
      await supabase.from('portfolios').update({ deleted_at: new Date().toISOString() }).eq('id', id);
      await loadPortfolios();
      render(null);
    }, { danger:true, confirmLabel:'Eliminar' });
  }));

  const createCard = document.getElementById('home-create-card');
  if(createCard) createCard.addEventListener('click', () => {
    askPrompt('Nueva cartera', 'Nombre de la cartera', async (name) => {
      const { data, error } = await supabase.from('portfolios').insert({ name }).select('id').single();
      if(error){ showStatus('Error al crear la cartera.'); render(currentScenario); return; }
      portfolioId = data.id;
      activePortfolioName = name;
      currentScreen = 'portfolio';
      selectedId = null;
      diversificationFilter = null;
      document.getElementById('app').innerHTML = 'Cargando…';
      await loadAll();
      render(null);
      autoUpdateQuotes();
    });
  });

  wireViewOverlay(app);
}

function render(scenario){
  if(!session) return; // una operación asíncrona pendiente terminó después de cerrar sesión; no repintar la app
  if(currentScreen !== 'portfolio'){
    renderHomeScreen();
    return;
  }
  currentScenario = scenario;
  const app = document.getElementById('app');
  const totals = computeTotals();
  const cagr = computeCAGR(totals);
  const conc = computeConcentration(totals);
  let html = '';

  html += topNavBar();

  html += `<div class="pf-header" style="display:flex;justify-content:space-between;align-items:center;flex-shrink:0;margin-bottom:12px;gap:16px;">
    <div class="pf-kpis" style="display:flex;gap:16px;flex-wrap:nowrap;align-items:center;min-width:0;">
      <div style="flex-shrink:0;white-space:nowrap;">
        <h1 style="font-family:'Calibri','Carlito',sans-serif;font-weight:600;font-size:20px;margin:0;white-space:nowrap;">${activePortfolioName}</h1>
      </div>
      ${kpiBlock('Invertido', fmtEUR(totals.invested))}
      ${kpiBlock('Valor actual', fmtEUR(totals.value))}
      ${kpiBlock('Ganancia', (totals.gain>=0?'+':'')+fmtEUR(totals.gain), totals.gain>=0?'var(--green)':'var(--red)')}
      ${kpiBlock('Ganancia %', (totals.gainPct>=0?'+':'')+fmtPct(totals.gainPct), totals.gainPct>=0?'var(--green)':'var(--red)')}
      ${kpiBlock('Posiciones', totals.withData+' / '+totals.total)}
      ${kpiBlock('Comisiones broker', fmtEUR(totals.commission))}
      ${kpiBlock('Rentab. anual.', cagr.value===null?'—':(cagr.value>=0?'+':'')+fmtPct(cagr.value), cagr.value===null?'var(--text-dim)':(cagr.value>=0?'var(--green)':'var(--red)'), cagr.value===null ? `Necesita al menos 30 días de historial desde la primera compra (llevas ${cagr.days}).` : `CAGR desde la primera compra, hace ${cagr.days} días.`)}
      ${kpiBlock('Concentración', conc.name?Math.round(conc.pct)+'%':'—', null, conc.name ? `Tu posición mayor es ${conc.name}, con el ${Math.round(conc.pct)}% del valor actual de la cartera.` : '')}
    </div>
    <div class="pf-controls" style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
      <div style="display:flex; gap:8px;">
        <select id="scenario-select" class="pill-select" style="border:1px solid ${scenario?'var(--accent-border)':'var(--border)'};background:${scenario?'var(--accent-soft)':'var(--panel-2)'};color:${scenario?'var(--accent-text)':'var(--text-dim)'};max-width:180px;font-size:10.5px;">
          <option value="">Posibles escenarios</option>
          ${SCENARIOS.map(sc=>`<option value="${sc.key}" ${scenario===sc.key?'selected':''}>${sc.label}</option>`).join('')}
        </select>
        <button id="addpos-btn" class="pill-btn" style="border:1px solid var(--border);background:var(--panel-2);color:var(--text-dim);">+ Añadir posición</button>
      </div>
    </div>
  </div>

  <div class="pf-charts-row" style="display:flex;gap:10px;flex-shrink:0;height:clamp(110px,18vh,180px);margin-bottom:10px;">
    <div class="pf-chart" style="flex:2.2;min-width:0;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:10px 16px;box-sizing:border-box;">
      ${drawChart()}
    </div>
    <div class="pf-donut" style="flex:0.9;min-width:0;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:8px 10px;box-sizing:border-box;display:flex;flex-direction:column;">
      <div style="font-size:9px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;flex-shrink:0;">Por mercado</div>
      <div style="flex:1;min-height:0;">${drawDiversification(breakdownByWeight(p=>p.market), k=>MARKET[k]?.color||'#6E7177', k=>MARKET[k]?.label||k, 5, fundedDetail(p=>p.market), 'market')}</div>
    </div>
    <div class="pf-donut" style="flex:0.9;min-width:0;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:8px 10px;box-sizing:border-box;display:flex;flex-direction:column;">
      <div style="font-size:9px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;flex-shrink:0;">Por sector</div>
      <div style="flex:1;min-height:0;">${drawDiversification(breakdownByWeight(p=>p.sector), sectorColor, k=>k, 6, fundedDetail(p=>p.sector), 'sector')}</div>
    </div>
  </div>

  ${diversificationFilter ? `<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:11px;color:var(--text-dim);flex-shrink:0;">
    Filtrando tabla por <b style="color:var(--text);">${diversificationFilter.type==='market' ? (MARKET[diversificationFilter.key]?.label||diversificationFilter.key) : diversificationFilter.key}</b>
    <button id="clear-filter-btn" style="cursor:pointer;background:var(--panel-2);border:1px solid var(--border);color:var(--text-dim);border-radius:10px;padding:1px 9px;font-size:10px;">Quitar filtro ✕</button>
  </div>` : ''}

  ${renderPositionsTable(scenario)}

  ${renderModal()}
  ${renderAddPositionModal()}
  ${renderViewOverlay()}
  ${renderDialog()}
  ${renderStatusToast()}`;

  app.innerHTML = html;

  app.querySelectorAll('table.postable tbody tr[data-id]').forEach(t=>t.addEventListener('click',()=>{
    selectedId = t.getAttribute('data-id');
    modalRange = 'mes';
    modalChartState = {loading:true, error:null, points:null};
    const pos = portfolio.positions.find(p=>p.id===selectedId);
    if(pos && pos.business_summary){
      modalCompanyState = {loading:false, error:null, summary:pos.business_summary, source:pos.business_summary_source};
    } else if(pos && pos.ticker){
      modalCompanyState = {loading:true, error:null, summary:null};
    } else {
      modalCompanyState = {loading:false, error:null, summary:null};
    }
    render(currentScenario);
    if(pos && pos.ticker) loadModalChart(pos.ticker, modalRange);
    if(pos && pos.ticker && !pos.business_summary) loadModalCompanyInfo(pos);
  }));

  const sel = document.getElementById('scenario-select');
  if(sel) sel.addEventListener('change', () => render(sel.value || null));

  app.querySelectorAll('.div-slice').forEach(el=>el.addEventListener('click',()=>{
    const type = el.getAttribute('data-type'), key = el.getAttribute('data-key');
    if(key==='__otros__') return;
    if(diversificationFilter && diversificationFilter.type===type && diversificationFilter.key===key){
      diversificationFilter = null;
    } else {
      diversificationFilter = {type, key};
    }
    render(currentScenario);
  }));

  const clearFilterBtn = document.getElementById('clear-filter-btn');
  if(clearFilterBtn) clearFilterBtn.addEventListener('click', () => { diversificationFilter = null; render(currentScenario); });

  app.querySelectorAll('.range-btn').forEach(b=>b.addEventListener('click',()=>{
    modalRange = b.getAttribute('data-range');
    modalChartState = {loading:true, error:null, points:null};
    render(currentScenario);
    const pos = portfolio.positions.find(p=>p.id===selectedId);
    if(pos && pos.ticker) loadModalChart(pos.ticker, modalRange);
  }));

  const closeBtn = document.getElementById('modal-close');
  if(closeBtn) closeBtn.addEventListener('click', () => { selectedId = null; modalChartToken++; modalCompanyToken++; render(currentScenario); });
  const backdrop = document.getElementById('modal-backdrop');
  if(backdrop) backdrop.addEventListener('click', (e) => { if(e.target===backdrop){ selectedId = null; modalChartToken++; modalCompanyToken++; render(currentScenario); } });

  const deleteBtn = document.getElementById('modal-delete');
  if(deleteBtn) deleteBtn.addEventListener('click', () => {
    const pos = portfolio.positions.find(p=>p.id===selectedId);
    if(!pos) return;
    askConfirm('Eliminar posición', `¿Eliminar "${pos.name}"? Se puede recuperar más adelante.`, async () => {
      await supabase.from('deleted_items_log').insert({ item_type:'position', item_id:pos.id, snapshot:pos });
      await supabase.from('positions').update({ deleted_at: new Date().toISOString() }).eq('id', pos.id);
      selectedId = null; modalChartToken++; modalCompanyToken++;
      markDirty();
      await loadAll();
      showStatus(`Posición "${pos.name}" eliminada.`);
      render(currentScenario);
    }, { danger:true, confirmLabel:'Eliminar' });
  });

  app.querySelectorAll('input[data-field], textarea[data-field]').forEach(el=>{
    el.addEventListener('blur', async () => {
      const id = el.getAttribute('data-id'), field = el.getAttribute('data-field');
      const isNumeric = field==='invested'||field==='price'||field==='commission';
      const value = isNumeric ? num(el.value) : el.value;
      const ok = await updatePositionField(id, field, value);
      const pos = portfolio.positions.find(p=>p.id===id);
      if(pos && ok) pos[field] = value;
      if(ok && (field==='invested'||field==='price')) markDirty();
      if(!ok) showStatus('Error al guardar — revisa la conexión.');
      render(currentScenario);
    });
  });

  const addPosBtn = document.getElementById('addpos-btn');
  if(addPosBtn) addPosBtn.addEventListener('click', () => {
    addPositionOpen = true; addPositionError = null; addPositionSelected = null;
    render(currentScenario);
  });
  wireAddPositionModal(app);

  wireMenu(app);
  wireDialog(app);

  wireViewOverlay(app);
}

function renderLogin(){
  const app = document.getElementById('app');
  const mode = authMode;
  const msgBlock = `${loginError ? `<div style="color:var(--red);font-size:13.5px;margin-bottom:16px;">${loginError}</div>` : ''}${authInfo ? `<div style="color:var(--green);font-size:13.5px;margin-bottom:16px;">${authInfo}</div>` : ''}`;

  let formInner;
  if(mode === 'recovery'){
    formInner = `
      <div class="field" style="margin-bottom:16px;"><label>Nueva contraseña</label><input id="login-password" type="password" required minlength="6" autocomplete="new-password" autofocus/></div>
      <div class="field" style="margin-bottom:22px;"><label>Repite la contraseña</label><input id="login-password2" type="password" required minlength="6" autocomplete="new-password"/></div>
      ${msgBlock}
      <button type="submit" class="pill-btn" style="width:100%;border:1px solid var(--accent-border);background:var(--accent-soft);color:var(--accent-text);padding:13px;font-size:15px;font-weight:600;" ${loginBusy?'disabled':''}>${loginBusy?'Guardando…':'Guardar nueva contraseña'}</button>`;
  } else if(mode === 'reset'){
    formInner = `
      <div class="field" style="margin-bottom:22px;"><label>Email</label><input id="login-email" type="email" required autocomplete="username" autofocus/></div>
      ${msgBlock}
      <button type="submit" class="pill-btn" style="width:100%;border:1px solid var(--accent-border);background:var(--accent-soft);color:var(--accent-text);padding:13px;font-size:15px;font-weight:600;" ${loginBusy?'disabled':''}>${loginBusy?'Enviando…':'Enviar enlace de recuperación'}</button>
      <div style="text-align:center;margin-top:16px;"><button type="button" id="auth-back-btn" style="cursor:pointer;background:none;border:none;color:var(--text-faint);font-size:12.5px;padding:0;">← Volver a entrar</button></div>`;
  } else {
    const isSignup = mode === 'signup';
    formInner = `
      <div class="field" style="margin-bottom:16px;"><label>Email</label><input id="login-email" type="email" required autocomplete="username" autofocus/></div>
      <div class="field" style="margin-bottom:${isSignup?'10px':'8px'};"><label>Contraseña</label><input id="login-password" type="password" required minlength="6" autocomplete="${isSignup?'new-password':'current-password'}"/></div>
      ${!isSignup ? `<div style="text-align:right;margin-bottom:16px;"><button type="button" id="auth-forgot-btn" style="cursor:pointer;background:none;border:none;color:var(--text-faint);font-size:12px;padding:0;">¿Olvidaste tu contraseña?</button></div>` : '<div style="margin-bottom:16px;"></div>'}
      ${msgBlock}
      <button type="submit" class="pill-btn" style="width:100%;border:1px solid var(--accent-border);background:var(--accent-soft);color:var(--accent-text);padding:13px;font-size:15px;font-weight:600;" ${loginBusy?'disabled':''}>${loginBusy?(isSignup?'Creando…':'Entrando…'):(isSignup?'Crear cuenta':'Entrar')}</button>
      <div style="text-align:center;margin-top:16px;font-size:12.5px;color:var(--text-faint);">${isSignup?'¿Ya tienes cuenta?':'¿No tienes cuenta?'} <button type="button" id="auth-switch-btn" style="cursor:pointer;background:none;border:none;color:var(--accent-text);font-size:12.5px;padding:0;font-weight:600;">${isSignup?'Entrar':'Crear una'}</button></div>`;
  }

  app.innerHTML = `<div class="login-screen">
    <button id="login-theme-toggle" class="theme-toggle" style="position:absolute;top:20px;right:20px;" title="Cambiar a modo ${theme==='dark'?'claro':'oscuro'}">${theme==='dark'?'☀':'☾'}</button>
    <div style="width:100%;max-width:400px;padding:0 20px;box-sizing:border-box;">
      <div style="display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:26px;">
        <div style="margin-bottom:18px;">${walletbookIcon(150)}</div>
        <h1 style="font-family:'Fraunces',serif;font-optical-sizing:auto;font-weight:900;font-size:34px;margin:0;letter-spacing:-.01em;">Walletbook</h1>
        <div style="font-size:15px;color:var(--text-faint);margin-top:7px;">Sigue tu cartera. Descubre otras.</div>
      </div>
      <form id="login-form" style="background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:30px;box-sizing:border-box;box-shadow:0 12px 32px rgba(0,0,0,0.18);">
        ${formInner}
      </form>
    </div>
  </div>`;
  const themeBtn = document.getElementById('login-theme-toggle');
  if(themeBtn) themeBtn.addEventListener('click', () => {
    theme = theme === 'dark' ? 'light' : 'dark';
    localStorage.setItem('ps_theme', theme);
    document.documentElement.setAttribute('data-theme', theme);
    renderLogin();
  });
  const switchBtn = document.getElementById('auth-switch-btn');
  if(switchBtn) switchBtn.addEventListener('click', () => {
    authMode = authMode === 'signup' ? 'login' : 'signup';
    loginError = null; authInfo = null;
    renderLogin();
  });
  const forgotBtn = document.getElementById('auth-forgot-btn');
  if(forgotBtn) forgotBtn.addEventListener('click', () => {
    authMode = 'reset';
    loginError = null; authInfo = null;
    renderLogin();
  });
  const backBtn = document.getElementById('auth-back-btn');
  if(backBtn) backBtn.addEventListener('click', () => {
    authMode = 'login';
    loginError = null; authInfo = null;
    renderLogin();
  });
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    if(mode === 'recovery'){
      const password = document.getElementById('login-password').value;
      const password2 = document.getElementById('login-password2').value;
      if(password !== password2){ loginError = 'Las contraseñas no coinciden.'; renderLogin(); return; }
      loginBusy = true; loginError = null; authInfo = null;
      renderLogin();
      const { error } = await supabase.auth.updateUser({ password });
      loginBusy = false;
      if(error){ loginError = 'No se pudo guardar la contraseña. Vuelve a pedir el enlace.'; renderLogin(); return; }
      await supabase.auth.signOut();
      authMode = 'login';
      authInfo = 'Contraseña actualizada. Ya puedes entrar con tu nueva contraseña.';
      renderLogin();
      return;
    }
    if(mode === 'reset'){
      const email = document.getElementById('login-email').value;
      loginBusy = true; loginError = null; authInfo = null;
      renderLogin();
      await supabase.auth.resetPasswordForEmail(email, { redirectTo: 'https://davidrodrigueznavas.github.io/walletbook/' });
      loginBusy = false;
      authInfo = 'Si existe una cuenta con ese email, te hemos enviado un enlace para restablecer la contraseña.';
      renderLogin();
      return;
    }
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;
    loginBusy = true; loginError = null; authInfo = null;
    renderLogin();
    if(mode === 'signup'){
      const { error } = await supabase.auth.signUp({ email, password, options: { emailRedirectTo: 'https://davidrodrigueznavas.github.io/walletbook/' } });
      loginBusy = false;
      if(error){
        let msg = 'No se pudo crear la cuenta.';
        if(/already registered|already exists/i.test(error.message)) msg = 'Ya existe una cuenta con ese email.';
        else if(/rate limit/i.test(error.message)) msg = 'Demasiados intentos seguidos — espera unos minutos y vuelve a intentarlo.';
        else if(/invalid/i.test(error.message)) msg = 'Ese email no es válido.';
        loginError = msg; renderLogin(); return;
      }
      authMode = 'login';
      authInfo = 'Cuenta creada. Revisa tu email para confirmarla antes de entrar.';
      renderLogin();
      return;
    }
    const { error } = await supabase.auth.signInWithPassword({ email, password });
    loginBusy = false;
    if(error){ loginError = 'Email o contraseña incorrectos.'; renderLogin(); }
    // si no hay error, onAuthStateChange se encarga de cargar el dashboard
  });
}

let lastRenderedForSession = undefined;
supabase.auth.onAuthStateChange(async (event, s) => {
  session = s;
  if(event === 'PASSWORD_RECOVERY'){
    authMode = 'recovery';
    loginError = null; authInfo = null;
    renderLogin();
    return;
  }
  if(authMode === 'recovery' && session) return; // no navegar a la app mientras se muestra el formulario de recuperación
  const sessionKey = session ? session.user.id : null;
  if(sessionKey === lastRenderedForSession) return; // evita recargar dos veces en el arranque
  lastRenderedForSession = sessionKey;
  if(session){
    document.getElementById('app').innerHTML = 'Cargando…';
    portfolioId = null;
    await loadPortfolios();
    await loadProfile();
    if(authMode === 'recovery') return; // un evento PASSWORD_RECOVERY tomó el control mientras cargábamos
    currentScreen = 'home';
    render(null);
  } else {
    portfolio = {positions:[]}; history = []; portfolioId = null; currentScreen = null; profile = null;
    authMode = 'login';
    renderLogin();
  }
});
</script>
