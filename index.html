function ruleMetricValue(metric, p, portfolioValue){
  const price = num(p.price), cur = p.current_price_eur, date = p.date || p.purchase_date;
  switch(metric){
    case 'gain_pct': return gainPctOf(p);
    case 'gain_eur': { const gp = gainPctOf(p); return gp===null ? null : currentValueOf(p) - investedOf(p); }
    case 'loss_pct': { const gp = gainPctOf(p); return gp===null ? null : -gp; }
    case 'loss_eur': { const gp = gainPctOf(p); return gp===null ? null : investedOf(p) - currentValueOf(p); }
    case 'weight_deviation': {
      if(!p.target_weight || !portfolioValue) return null;
      const weightPct = portfolioValue>0 ? currentValueOf(p)/portfolioValue*100 : 0;
      return weightPct - p.target_weight;
    }
    case 'annualized_return': {
      if(!price || !cur || price<=0 || !date) return null;
      const days = Math.max(1, Math.round((new Date() - new Date(date+'T00:00:00')) / 86400000));
      if(days < 30) return null;
      return (Math.pow(cur/price, 365/days) - 1) * 100;
    }
    case 'holding_age_days': {
      if(!date) return null;
      return Math.round((new Date() - new Date(date+'T00:00:00')) / 86400000);
    }
    case 'horizon_proximity_years': {
      const y = parseInt(p.horizon, 10);
      if(!y || isNaN(y)) return null;
      return y - new Date().getFullYear();
    }
    default: return null;
  }
}
function ruleMatches(rule, value){
  if(value===null || value===undefined) return false;
  return rule.operator==='gt' ? value > rule.threshold : value < rule.threshold;

function riskBand(score){
  if(score>=80) return {label:'Riesgo de crash muy alto', color:'#DC2626'};
  if(score>=60) return {label:'Riesgo elevado', color:'#F87171'};
  if(score>=35) return {label:'Riesgo moderado', color:'#FBBF24'};
  return {label:'Riesgo bajo', color:'#4ADE80'};
}

async function loadMarketIndicators(){
  if(marketIndicatorsLoading) return;
  marketIndicatorsLoading = true; marketIndicatorsError = null;
  try{
    const [sp500Res, vixRes] = await Promise.all([
      callEdgeFunction('ticker-history', {ticker:'^GSPC', range:'semanal'}),
      callEdgeFunction('ticker-history', {ticker:'^VIX', range:'mes'}),
    ]);
    if(!sp500Res.ok || !sp500Res.points || sp500Res.points.length<41) throw new Error((sp500Res&&sp500Res.error) || 'Sin datos del S&P 500.');
    if(!vixRes.ok || !vixRes.points || !vixRes.points.length) throw new Error((vixRes&&vixRes.error) || 'Sin datos del VIX.');

    const sp500Closes = sp500Res.points.map(p=>p.c);
    const sma40Arr = computeSMA(sp500Closes, 40);
    const lastSma40 = sma40Arr[sma40Arr.length-1];
    const lastPrice = sp500Closes[sp500Closes.length-1];
    const pctVsSma40 = lastSma40 ? ((lastPrice-lastSma40)/lastSma40)*100 : null;
    const vixLevel = vixRes.points[vixRes.points.length-1].c;

    // Cuanto más se acerca (o cruza por debajo) el S&P 500 a su media de 40
    // semanas, más puntuación de riesgo — 0 muy por encima (seguro), 100 muy
    // por debajo (crash). El VIX se mapea linealmente entre 10 (calma) y 40
    // (pánico). El índice combinado es la media simple de ambos, sin más
    // pretensión que ser una heurística legible, no un modelo validado.
    const score40 = pctVsSma40==null ? null : Math.max(0, Math.min(100, 50 - pctVsSma40*5));
    const scoreVix = Math.max(0, Math.min(100, (vixLevel-10)*(100/30)));
    const combined = score40==null ? scoreVix : (score40+scoreVix)/2;

    marketIndicators = { sp500Price:lastPrice, sp500Sma40:lastSma40, pctVsSma40, score40, vixLevel, scoreVix, combined };
  } catch(e){
    marketIndicatorsError = (e && e.message) || 'Error al consultar indicadores de mercado.';
  }
  marketIndicatorsLoading = false;
  render(null);
}

          <span style="font-weight:700;color:${m.pctVsSma40>=0?'var(--green)':'var(--red)'};">${m.pctVsSma40>=0?'+':''}${m.pctVsSma40.toFixed(1)}%${m.pctVsSma40<0?' · por debajo':''}</span>

let liquidityIndicator = null, liquidityIndicatorLoading = false, liquidityIndicatorError = null;

async function loadLiquidityIndicator(){
  if(liquidityIndicatorLoading) return;
  liquidityIndicatorLoading = true; liquidityIndicatorError = null;
  try{
    const [hygRes, iefRes] = await Promise.all([
      callEdgeFunction('ticker-history', {ticker:'HYG', range:'tecnico'}),
      callEdgeFunction('ticker-history', {ticker:'IEF', range:'tecnico'}),
    ]);
    if(!hygRes.ok || !hygRes.points || hygRes.points.length<51) throw new Error((hygRes&&hygRes.error) || 'Sin datos de HYG.');
    if(!iefRes.ok || !iefRes.points || iefRes.points.length<51) throw new Error((iefRes&&iefRes.error) || 'Sin datos de IEF.');

    // HYG (bonos high-yield) / IEF (Tesoro EEUU medio plazo): proxy de mercado
    // de apetito por el riesgo / liquidez — cuando el ratio sube, el mercado
    // absorbe deuda de más riesgo con facilidad (liquidez amplia); cuando cae
    // por debajo de su propia media, se suele leer como estrés de crédito.
    const n = Math.min(hygRes.points.length, iefRes.points.length);
    const hygCloses = hygRes.points.slice(hygRes.points.length-n).map(p=>p.c);
    const iefCloses = iefRes.points.slice(iefRes.points.length-n).map(p=>p.c);
    const ratio = hygCloses.map((v,i) => v/iefCloses[i]);
    const sma50Arr = computeSMA(ratio, 50);
    const lastSma = sma50Arr[sma50Arr.length-1];
    const lastRatio = ratio[ratio.length-1];
    const pctVsSma = lastSma ? ((lastRatio-lastSma)/lastSma)*100 : null;
    const score = pctVsSma==null ? null : Math.max(0, Math.min(100, 50 - pctVsSma*12));

    liquidityIndicator = { ratio:lastRatio, sma50:lastSma, pctVsSma, score };
  } catch(e){
    liquidityIndicatorError = (e && e.message) || 'Error al consultar el indicador de liquidez.';
  }
  liquidityIndicatorLoading = false;
  render(null);
}

function renderLiquidityCard(){
  if(!liquidityIndicator && !liquidityIndicatorLoading && !liquidityIndicatorError){
    loadLiquidityIndicator();
  }
  let body;
  if(liquidityIndicatorLoading && !liquidityIndicator){
    body = `<div style="font-size:12px;color:var(--text-faint);padding:16px 0;">Consultando…</div>`;
  } else if(liquidityIndicatorError && !liquidityIndicator){

  } else if(liquidityIndicator){

    // Aquí un score alto significa MÁS liquidez (al contrario que el índice

    const liqBand = l.score>=65 ? {label:'Liquidez amplia', color:'#4ADE80'} : l.score>=35 ? {label:'Liquidez normal', color:'#FBBF24'} : {label:'Estrés de crédito/liquidez', color:'#DC2626'};

        <div style="width:56px;height:56px;border-radius:50%;border:4px solid ${liqBand.color};display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;color:${liqBand.color};flex-shrink:0;">${Math.round(l.score)}</div>
        <div style="font-size:14px;font-weight:700;color:${liqBand.color};">${liqBand.label}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;">
        <div style="display:flex;justify-content:space-between;align-items:center;font-size:11.5px;">
          <span style="color:var(--text-faint);cursor:help;border-bottom:1px dotted var(--text-faint);" title="Ratio HYG (bonos high-yield) / IEF (Tesoro EEUU medio plazo) frente a su propia media de 50 días. Por encima de su media, el mercado absorbe bien el riesgo (liquidez amplia); por debajo, estrés de crédito.">HYG/IEF vs media 50d</span>
          <span style="font-weight:700;color:${l.pctVsSma>=0?'var(--green)':'var(--red)'};">${l.pctVsSma>=0?'+':''}${l.pctVsSma.toFixed(1)}%</span>

        <div style="display:flex;justify-content:space-between;align-items:center;font-size:11.5px;">
          <span style="color:var(--text-faint);">Ratio actual</span>
          <span style="font-weight:700;">${l.ratio.toFixed(3)}</span>
        </div>
      </div>`;
  } else {
    body = '';
  }
  return `<div class="indicator-card" style="background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px 18px;">
    <div style="font-size:9.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;margin-bottom:12px;cursor:help;border-bottom:1px dotted var(--text-faint);display:inline-block;" title="Proxy de liquidez de mercado usando el ratio entre bonos high-yield (HYG) y Tesoro EEUU (IEF), vía Yahoo Finance. No es la liquidez real de la Fed, es una aproximación de mercado.">Liquidez de mercado</div>

function computeSMA(values, period){
  const out = new Array(values.length).fill(null);
  let sum = 0;
  for(let i=0;i<values.length;i++){
    sum += values[i];
    if(i>=period) sum -= values[i-period];
    if(i>=period-1) out[i] = sum/period;
  }
  return out;
}
function computeRSI(values, period=14){
  const out = new Array(values.length).fill(null);
  if(values.length < period+1) return out;
  let gains=0, losses=0;
  for(let i=1;i<=period;i++){
    const diff = values[i]-values[i-1];
    if(diff>=0) gains+=diff; else losses-=diff;
  }
  let avgGain = gains/period, avgLoss = losses/period;
  out[period] = avgLoss===0 ? 100 : 100 - 100/(1+avgGain/avgLoss);
  for(let i=period+1;i<values.length;i++){
    const diff = values[i]-values[i-1];
    const gain = diff>0?diff:0, loss = diff<0?-diff:0;
    avgGain = (avgGain*(period-1)+gain)/period;
    avgLoss = (avgLoss*(period-1)+loss)/period;
    out[i] = avgLoss===0 ? 100 : 100 - 100/(1+avgGain/avgLoss);
  }
  return out;
}

function fmtNewsDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  const diffH = (Date.now() - d.getTime()) / 3600000;
  if(diffH < 1) return 'hace ' + Math.max(1, Math.round(diffH*60)) + ' min';
  if(diffH < 24) return 'hace ' + Math.round(diffH) + ' h';
  if(diffH < 24*7) return 'hace ' + Math.round(diffH/24) + ' d';
  return d.toLocaleDateString('es-ES', {day:'numeric', month:'short'});
}

async function loadPortfolioNews(){
  const token = ++portfolioNewsToken;
  portfolioNewsLoading = true; portfolioNewsError = null; portfolioNews = null;
  const withTicker = portfolio.positions.filter(p => p.ticker && investedOf(p) > 0);
  if(!withTicker.length){
    portfolioNews = [];
    portfolioNewsLoading = false;
    return;
  }
  try{
    const results = await Promise.all(withTicker.map(p =>
      callEdgeFunction('ticker-news', {q: p.ticker}).catch(() => null)
    ));
    if(token !== portfolioNewsToken) return;
    const seen = new Set();
    const merged = [];
    results.forEach((res, i) => {
      if(!res || !res.ok) return;
      (res.news || []).forEach(n => {
        if(!n.link || seen.has(n.link)) return;
        seen.add(n.link);
        merged.push({ ...n, ticker: withTicker[i].ticker, positionName: withTicker[i].name });
      });
    });
    merged.sort((a,b) => new Date(b.publishedAt||0) - new Date(a.publishedAt||0));
    portfolioNews = merged.slice(0, 40);
  } catch(e){
    if(token !== portfolioNewsToken) return;
    portfolioNewsError = 'Error de conexión.';
  }
  if(token === portfolioNewsToken) portfolioNewsLoading = false;
}

function evaluateScreenerConditions(conditions, row){
  return conditions.every(c => {
    const metric = SCREENER_METRIC[c.metric];
    if(!metric) return false;
    const value = metric.get(row);
    if(value===null || value===undefined || isNaN(value)) return false;
    return c.operator==='gt' ? value > c.value : value < c.value;
  });
}

function matchesForScreener(screener){
  if(!screenerUniverse || !screener.screener_conditions || !screener.screener_conditions.length) return [];
  return screenerUniverse.filter(row => evaluateScreenerConditions(screener.screener_conditions, row));
}

  return null;
}
function computeTotals(){
  let invested=0, value=0, withData=0, commission=0;
  portfolio.positions.forEach(p => { invested+=investedOf(p); value+=currentValueOf(p); commission+=commissionOf(p); if(investedOf(p)>0) withData++; });
  return {invested, value, gain: value-invested, gainPct: invested>0 ? (value-invested)/invested*100 : 0, withData, total: portfolio.positions.length, commission};
}

function computeCAGR(totals){
  const withDate = portfolio.positions.filter(p=>p.date && investedOf(p)>0);
  if(!withDate.length || totals.invested<=0) return {days:0, value:null};
  const earliest = withDate.reduce((min,p)=>p.date<min?p.date:min, withDate[0].date);
  const days = Math.max(1, Math.round((new Date() - new Date(earliest+'T00:00:00')) / 86400000));
  if(days < 30 || totals.value<=0) return {days, value:null};
  const ratio = totals.value/totals.invested;
  return {days, value: (Math.pow(ratio, 365/days) - 1) * 100};
}

function computeConcentration(totals){
  let maxVal=0, maxName=null;
  portfolio.positions.forEach(p=>{
    const v = currentValueOf(p);
    if(v>maxVal){ maxVal=v; maxName=p.name; }
  });
  return {pct: totals.value>0 ? maxVal/totals.value*100 : 0, name:maxName};
}

function effectiveHistory(){
  // Además de los snapshots guardados, arrancamos la curva en la fecha de
  // compra más antigua: ese día, por definición, valor = invertido (0 de
  // ganancia), sin necesidad de precios históricos.
  const withDate = portfolio.positions.filter(p => p.date && investedOf(p) > 0);
  const combined = history.slice();
  if(withDate.length){
    const earliest = withDate.reduce((min, p) => p.date < min ? p.date : min, withDate[0].date);
    if(!combined.some(h => h.date === earliest)){
      const investedAtEarliest = withDate.filter(p => p.date === earliest).reduce((a, p) => a + investedOf(p), 0);
      combined.push({date: earliest, invested: Math.round(investedAtEarliest), value: Math.round(investedAtEarliest)});
    }
  }
  combined.sort((a, b) => a.date.localeCompare(b.date));
  return combined;
}

const SECTOR_LIST = Object.keys(SENS);
function sectorColor(sector){
  const idx = SECTOR_LIST.indexOf(sector);
  const hue = idx>=0 ? Math.round(idx*360/SECTOR_LIST.length) : 0;
  return `hsl(${hue},50%,56%)`;
}

function breakdownByWeight(keyFn){
  // Reparto de TODA la cartera (las 45 posiciones) según su peso objetivo,
  // no solo de lo que ya se ha invertido -- así se ve el diseño completo.
  const map = {};
  portfolio.positions.forEach(p=>{
    const w = p.target_weight || 0;
    if(w<=0) return;
    const k = keyFn(p);
    map[k] = (map[k]||0) + w;
  });
  return map;
}

function fundedDetail(keyFn){
  const map = {};
  portfolio.positions.forEach(p=>{
    if(investedOf(p)<=0) return;
    const k = keyFn(p);
    if(!map[k]) map[k] = {count:0, names:[]};
    map[k].count++;
    map[k].names.push(p.name);
  });
  return map;
}

function drawDiversification(breakdown, colorFor, labelFor, maxSlices, funded, filterType){
  let entries = Object.entries(breakdown).sort((a,b)=>b[1]-a[1]);
  if(entries.length===0){
    return `<div style="font-size:10.5px;color:var(--text-faint);height:100%;display:flex;align-items:center;">Sin datos todavía.</div>`;
  }
  let mergedOthers = null;
  if(entries.length > maxSlices){
    const head = entries.slice(0,maxSlices-1);
    const tail = entries.slice(maxSlices-1);
    const restSum = tail.reduce((a,[,v])=>a+v,0);
    mergedOthers = tail.map(([k])=>k);
    entries = [...head, ['__otros__', restSum]];
  }
  const colorOf = (key) => key==='__otros__' ? '#6E7177' : colorFor(key);
  const fundedOf = (key) => key==='__otros__'
    ? (mergedOthers||[]).reduce((a,k)=>a+(funded[k]?funded[k].count:0), 0)
    : (funded[key] ? funded[key].count : 0);
  const namesOf = (key) => key==='__otros__'
    ? (mergedOthers||[]).flatMap(k=>funded[k]?funded[k].names:[])
    : (funded[key] ? funded[key].names : []);
  const total = entries.reduce((a,e)=>a+e[1],0);
  const size=94, cx=size/2, cy=size/2, r=size/2-2, inner=r*0.56;
  let svgInner;
  if(entries.length===1){
    const key = entries[0][0];
    svgInner = `<circle cx="${cx}" cy="${cy}" r="${(r+inner)/2}" fill="none" stroke="${colorOf(key)}" stroke-width="${r-inner}" class="div-slice" data-type="${filterType}" data-key="${key}" style="cursor:${key==='__otros__'?'default':'pointer'};"><title>${labelFor(key)}${fundedOf(key)?' · '+fundedOf(key)+' comprada(s): '+namesOf(key).join(', '):''}</title></circle>`;
  } else {
    let angle = -90;
    svgInner = entries.map(([key,val])=>{
      const frac = val/total;
      const sweep = frac*360;
      const large = sweep>180?1:0;
      const a0 = angle*Math.PI/180, a1=(angle+sweep)*Math.PI/180;
      const x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0);
      const x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
      const ix0=cx+inner*Math.cos(a0), iy0=cy+inner*Math.sin(a0);
      const ix1=cx+inner*Math.cos(a1), iy1=cy+inner*Math.sin(a1);
      const color = colorOf(key);
      const fc = fundedOf(key);
      angle += sweep;
      return `<path d="M ${x0} ${y0} A ${r} ${r} 0 ${large} 1 ${x1} ${y1} L ${ix1} ${iy1} A ${inner} ${inner} 0 ${large} 0 ${ix0} ${iy0} Z" fill="${color}" stroke="var(--panel)" stroke-width="1" class="div-slice" data-type="${filterType}" data-key="${key}" style="cursor:${key==='__otros__'?'default':'pointer'};"><title>${labelFor(key)}${fc?' · '+fc+' comprada(s): '+namesOf(key).join(', '):''}</title></path>`;
    }).join('');
  }
  const legend = entries.map(([key,val])=>{
    const pct = Math.round(val/total*100);
    const color = colorOf(key);
    const label = key==='__otros__' ? 'Otros' : labelFor(key);
    const fc = fundedOf(key);
    const names = namesOf(key);
    const isActive = diversificationFilter && diversificationFilter.type===filterType && diversificationFilter.key===key;
    return `<div class="div-slice" data-type="${filterType}" data-key="${key}" title="${fc?fc+' comprada(s): '+names.join(', ').replace(/"/g,'&quot;'):''}" style="cursor:${key==='__otros__'?'default':'pointer'};display:flex;align-items:center;gap:5px;font-size:10px;color:var(--text-dim);white-space:nowrap;${isActive?`background:var(--accent-soft);border-radius:4px;padding:1px 3px;margin:-1px -3px;`:''}">
      <span style="width:7px;height:7px;border-radius:50%;background:${color};flex-shrink:0;"></span>
      <span style="overflow:hidden;text-overflow:ellipsis;">${label}</span>
      ${fc ? `<span style="flex-shrink:0;background:var(--panel-2);color:var(--text);border-radius:8px;padding:0 5px;font-size:8.5px;font-weight:600;">${fc}</span>` : ''}
      <span style="margin-left:auto;color:var(--text-faint);flex-shrink:0;">${pct}%</span>
    </div>`;
  }).join('');
  return `<div style="display:flex;gap:10px;align-items:center;height:100%;">
    <svg viewBox="0 0 ${size} ${size}" style="width:auto;height:100%;max-width:45%;flex-shrink:0;">${svgInner}</svg>
    <div style="flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:center;gap:3px;overflow:hidden;">${legend}</div>
  </div>`;
}

function drawChart(){
  const hist = effectiveHistory();
  if(hist.length < 1) return '<div style="font-size:12px;color:var(--text-faint);">Sin snapshots todavía. Se guarda uno automáticamente en cuanto haya cambios.</div>';
  if(hist.length === 1){
    const pt = hist[0];
    const gain = pt.value - pt.invested;
    return `<div style="display:flex;align-items:center;gap:16px;height:100%;">
      <div style="width:12px;height:12px;border-radius:50%;background:var(--accent);flex-shrink:0;box-shadow:0 0 0 5px var(--accent-soft);"></div>
      <div>
        <div style="font-family:'Calibri','Carlito',sans-serif;font-size:20px;">${fmtEUR(pt.value)} <span style="font-size:13px;font-family:'Calibri','Carlito',sans-serif;color:${gain>=0?'var(--green)':'var(--red)'};">${gain>=0?'+':''}${fmtEUR(gain)}</span></div>
        <div style="font-size:11px;color:var(--text-faint);margin-top:3px;">Solo hay un snapshot guardado (${pt.date}). Se irán guardando automáticamente en días distintos según haya cambios, para que aquí aparezca la curva de evolución.</div>
      </div>
    </div>`;
  }
  const w=1100,h=190,padL=56,padR=12,padT=14,padB=24;
  const vals = hist.map(pt=>pt.value), invs = hist.map(pt=>pt.invested);
  const all = vals.concat(invs);
  const min=Math.min.apply(null,all), max=Math.max.apply(null,all);
  const range=(max-min)||Math.max(min,1)*0.1||1;
  const lo = min-range*0.1, hi = max+range*0.1, r2=(hi-lo)||1;
  const x = i => padL + (hist.length<=1?0:(i/(hist.length-1))*(w-padL-padR));
  const y = v => h-padB - ((v-lo)/r2)*(h-padT-padB);
  const lv = hist.map((pt,i)=>(i===0?'M':'L')+x(i)+','+y(pt.value)).join(' ');
  const li = hist.map((pt,i)=>(i===0?'M':'L')+x(i)+','+y(pt.invested)).join(' ');
  const area = lv + ` L${x(hist.length-1)},${h-padB} L${x(0)},${h-padB} Z`;
  const dots = hist.map((pt,i)=>`<circle cx="${x(i)}" cy="${y(pt.value)}" r="3" fill="#5B8DEF"/>`).join('');

  const yTickN = 5;
  const yGrid = Array.from({length:yTickN}, (_,i) => {
    const v = min + (max-min)*i/(yTickN-1);
    const yy = y(v);
    return `<line x1="${padL}" y1="${yy}" x2="${w-padR}" y2="${yy}" stroke="#26282D" stroke-width="1"/>
      <text x="${padL-8}" y="${yy+3}" font-size="9.5" fill="#6E7177" font-family="Calibri,Carlito,sans-serif" text-anchor="end">${fmtEUR(v)}</text>`;
  }).join('');

  const xTickN = Math.min(7, hist.length);
  const xIdx = xTickN<=1 ? [0] : Array.from({length:xTickN}, (_,i)=>Math.round(i*(hist.length-1)/(xTickN-1)));
  const xGrid = [...new Set(xIdx)].map(i => {
    const xx = x(i);
    return `<line x1="${xx}" y1="${padT}" x2="${xx}" y2="${h-padB}" stroke="#212327" stroke-width="1"/>
      <text x="${xx}" y="${h-6}" font-size="9.5" fill="#6E7177" font-family="Calibri,Carlito,sans-serif" text-anchor="middle">${hist[i].date.slice(5)}</text>`;
  }).join('');

  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:100%;display:block;">
    <defs><linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5B8DEF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#5B8DEF" stop-opacity="0"/>
    </linearGradient></defs>
    ${xGrid}
    ${yGrid}
    <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${h-padB}" stroke="#2D2F35" stroke-width="1"/>
    <path d="${area}" fill="url(#areaFill)"/>
    <path d="${li}" fill="none" stroke="#6E7177" stroke-width="1.3" stroke-dasharray="4,3"/>
    <path d="${lv}" fill="none" stroke="#5B8DEF" stroke-width="2.2"/>
    ${dots}
  </svg>`;
}

function drawPriceChart(points, p){
  const w=560,h=170,padL=56,padR=14,padT=12,padB=22;
  // yfinance devuelve el precio en divisa nativa; lo pasamos a EUR con el tipo
  // de cambio de hoy (el mismo que usa current_price_eur) para poder comparar
  // visualmente con el precio de compra, que el usuario introduce en EUR.
  const fx = (p.current_price_eur && p.current_price) ? p.current_price_eur / p.current_price : null;
  const toEur = c => fx ? c*fx : c;
  const seriesVals = points.map(pt=>toEur(pt.c));
  const buyPrice = fx ? num(p.price) : null;
  const allVals = seriesVals.concat(buyPrice!==null && buyPrice!==undefined ? [buyPrice] : []);
  const min=Math.min.apply(null,allVals), max=Math.max.apply(null,allVals);
  const range=(max-min)||Math.max(min,1)*0.05||1;
  const lo=min-range*0.12, hi=max+range*0.12, r2=(hi-lo)||1;
  const x = i => padL + (points.length<=1?0:(i/(points.length-1))*(w-padL-padR));
  const y = v => h-padB - ((v-lo)/r2)*(h-padT-padB);
  const line = points.map((pt,i)=>(i===0?'M':'L')+x(i)+','+y(seriesVals[i])).join(' ');
  const area = line + ` L${x(points.length-1)},${h-padB} L${x(0)},${h-padB} Z`;
  const up = seriesVals[seriesVals.length-1] >= seriesVals[0];
  const color = up ? '#4ADE80' : '#F87171';
  const fmtLabel = (iso) => {
    const d = new Date(iso);
    if(modalRange==='dia' || modalRange==='semana') return d.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit'}) + ' ' + d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
    if(modalRange==='anio') return d.toLocaleDateString('es-ES',{month:'short',year:'2-digit'});
    return d.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit'});
  };
  const fmtPrice = v => v.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2}) + (fx?' €':'');
  const buyLine = buyPrice!==null && buyPrice!==undefined && !isNaN(buyPrice)
    ? `<line x1="${padL}" y1="${y(buyPrice)}" x2="${w-padR}" y2="${y(buyPrice)}" stroke="#5B8DEF" stroke-width="1.2" stroke-dasharray="4,3"/>
       <text x="${w-padR}" y="${y(buyPrice)-4}" font-size="9.5" fill="#9DBBFF" font-family="Calibri,Carlito,sans-serif" text-anchor="end">tu compra: ${fmtPrice(buyPrice)}</text>`
    : '';

  const yTickN = 5;
  const yGrid = Array.from({length:yTickN}, (_,i) => {
    const v = min + (max-min)*i/(yTickN-1);
    const yy = y(v);
    return `<line x1="${padL}" y1="${yy}" x2="${w-padR}" y2="${yy}" stroke="#26282D" stroke-width="1"/>
      <text x="${padL-8}" y="${yy+3}" font-size="9" fill="#6E7177" font-family="Calibri,Carlito,sans-serif" text-anchor="end">${fmtPrice(v)}</text>`;
  }).join('');

  const xTickN = Math.min(6, points.length);
  const xIdx = xTickN<=1 ? [0] : Array.from({length:xTickN}, (_,i)=>Math.round(i*(points.length-1)/(xTickN-1)));
  const xGrid = [...new Set(xIdx)].map(i => {
    const xx = x(i);
    return `<line x1="${xx}" y1="${padT}" x2="${xx}" y2="${h-padB}" stroke="#212327" stroke-width="1"/>
      <text x="${xx}" y="${h-6}" font-size="8.5" fill="#6E7177" font-family="Calibri,Carlito,sans-serif" text-anchor="middle">${fmtLabel(points[i].t)}</text>`;
  }).join('');

  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:100%;display:block;">
    <defs><linearGradient id="areaFillModal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    ${xGrid}
    ${yGrid}
    <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${h-padB}" stroke="#2D2F35" stroke-width="1"/>
    <path d="${area}" fill="url(#areaFillModal)"/>
    ${buyLine}
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2"/>
    <circle cx="${x(points.length-1)}" cy="${y(seriesVals[seriesVals.length-1])}" r="3" fill="${color}"/>
  </svg>`;
}

    const res = await callEdgeFunction('ticker-history', {ticker, range});

    if(token !== modalChartToken) return;
    modalChartState = {loading:false, error:'Error de conexión.', points:null};

  render(currentScenario);
}

async function loadAll(){
  portfolioId = portfolioId || await loadPortfolioId();
  await loadPortfolios();
  if(!portfolioId){ portfolio = {positions:[]}; history = []; return; }
  const [{ data: rows, error: posErr }, { data: histRows, error: histErr }] = await Promise.all([
    supabase.from('positions').select('*').eq('portfolio_id', portfolioId).is('deleted_at', null),
    supabase.from('history').select('date,invested,value').eq('portfolio_id', portfolioId).order('date'),
  ]);
  if(posErr) console.error(posErr);
  if(histErr) console.error(histErr);
  portfolio = { positions: (rows||[]).map(r => ({ ...r, date: r.purchase_date })) };
  history = histRows || [];
}

async function saveSnapshotIfDirty(){
  if(!isDirty || currentScreen !== 'portfolio' || !portfolioId) return;
  const totals = computeTotals();
  const today = new Date().toISOString().slice(0,10);
  const { error } = await supabase.from('history').upsert(
    { portfolio_id: portfolioId, date: today, invested: Math.round(totals.invested), value: Math.round(totals.value) },
    { onConflict: 'portfolio_id,date' }
  );
  if(!error){
    isDirty = false;
    await loadAll();
    render(currentScenario);
  }
}

let dialogState = null; // {type:'prompt'|'confirm', title, message, placeholder, defaultValue, danger, confirmLabel, error, onConfirm}

function askPrompt(title, placeholder, onConfirm, defaultValue, opts){
  opts = opts || {};
  dialogState = { type:'prompt', title, placeholder, defaultValue, onConfirm, error:null, maxLength:opts.maxLength, allowEmpty:opts.allowEmpty, confirmLabel:opts.confirmLabel };
  render(currentScenario);
}
function askConfirm(title, message, onConfirm, opts){
  opts = opts || {};
  dialogState = { type:'confirm', title, message, danger:opts.danger, confirmLabel:opts.confirmLabel||'Confirmar', onConfirm, error:null };
  render(currentScenario);
}

function renderDialog(){
  if(!dialogState) return '';
  const isPrompt = dialogState.type === 'prompt';

    <div class="modal-card" style="max-width:380px;padding:22px;">
      <h3 style="font-family:'Calibri','Carlito',sans-serif;font-size:15px;font-weight:600;margin:0 0 10px;">${dialogState.title}</h3>
      ${dialogState.message ? `<div style="font-size:12.5px;color:var(--text-dim);margin-bottom:14px;line-height:1.5;">${dialogState.message}</div>` : ''}
      ${isPrompt ? `<input id="dialog-input" type="text" placeholder="${dialogState.placeholder||''}" value="${(dialogState.defaultValue||'').replace(/"/g,'&quot;')}" ${dialogState.maxLength?`maxlength="${dialogState.maxLength}"`:''} style="width:100%;background:var(--panel-2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;padding:9px 11px;box-sizing:border-box;" autofocus/>
      ${dialogState.maxLength ? `<div id="dialog-counter" style="font-size:10px;color:var(--text-faint);text-align:right;margin-top:4px;">${(dialogState.defaultValue||'').length}/${dialogState.maxLength}</div>` : ''}
      <div style="margin-bottom:${dialogState.maxLength?'6px':'14px'};"></div>` : '<div style="margin-bottom:6px;"></div>'}
      ${dialogState.error ? `<div style="color:var(--red);font-size:11.5px;margin-bottom:12px;">${dialogState.error}</div>` : ''}
      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <button id="dialog-cancel" class="pill-btn" style="border:1px solid var(--border);background:var(--panel-2);color:var(--text-dim);padding:8px 16px;font-size:12.5px;">Cancelar</button>
        <button id="dialog-confirm" class="pill-btn" style="border:1px solid ${dialogState.danger?'var(--red-border)':'var(--accent-border)'};background:${dialogState.danger?'var(--red-soft)':'var(--accent-soft)'};color:${dialogState.danger?'var(--red)':'var(--accent-text)'};padding:8px 16px;font-size:12.5px;font-weight:600;">${dialogState.confirmLabel||'Aceptar'}</button>
      </div>
    </div>
  </div>`;
}

function wireDialog(app){
  const input = document.getElementById('dialog-input');
  if(input){
    input.addEventListener('keydown', (e) => { if(e.key==='Enter'){ e.preventDefault(); document.getElementById('dialog-confirm').click(); } });
    const counter = document.getElementById('dialog-counter');
    if(counter) input.addEventListener('input', () => { counter.textContent = `${input.value.length}/${dialogState.maxLength}`; });
  }
  const cancelBtn = document.getElementById('dialog-cancel');
  if(cancelBtn) cancelBtn.addEventListener('click', () => { dialogState = null; render(currentScenario); });
  const confirmBtn = document.getElementById('dialog-confirm');
  if(confirmBtn) confirmBtn.addEventListener('click', async () => {
    if(dialogState.type === 'prompt'){
      const value = document.getElementById('dialog-input').value.trim();
      if(!value && !dialogState.allowEmpty){ dialogState.error = 'Escribe un valor.'; render(currentScenario); return; }
      const cb = dialogState.onConfirm;
      dialogState = null;
      await cb(value);
    } else {
      const cb = dialogState.onConfirm;
      dialogState = null;
      await cb();
    }
  });
  const backdrop = document.getElementById('dialog-backdrop');
  if(backdrop) backdrop.addEventListener('click', (e) => { if(e.target===backdrop){ dialogState = null; render(currentScenario); } });
}

function wireAddPositionModal(app){
  const tickerInput = document.getElementById('addpos-ticker');
  if(!tickerInput) return;

  const closeBtn = document.getElementById('addpos-close');
  if(closeBtn) closeBtn.addEventListener('click', () => { addPositionOpen = false; render(currentScenario); });
  const cancelBtn = document.getElementById('addpos-cancel');
  if(cancelBtn) cancelBtn.addEventListener('click', () => { addPositionOpen = false; render(currentScenario); });
  const backdrop = document.getElementById('addpos-backdrop');
  if(backdrop) backdrop.addEventListener('click', (e) => { if(e.target===backdrop){ addPositionOpen = false; render(currentScenario); } });

  const suggestionsBox = document.getElementById('addpos-suggestions');
  let searchTimer = null;
  tickerInput.addEventListener('input', () => {
    addPositionSelected = null;
    const q = tickerInput.value.trim();
    if(searchTimer) clearTimeout(searchTimer);
    if(q.length < 2){ suggestionsBox.innerHTML = ''; return; }
    searchTimer = setTimeout(async () => {
      const token = ++addPositionSearchToken;
      suggestionsBox.innerHTML = `<div style="padding:8px 10px;font-size:11.5px;color:var(--text-faint);">Buscando…</div>`;
      let results = [];
      try {
        const res = await callEdgeFunction('ticker-search', {q});
        results = (res && res.ok) ? res.results : [];
      } catch(e){ results = null; }
      if(token !== addPositionSearchToken) return;
      if(results === null){ suggestionsBox.innerHTML = `<div style="padding:8px 10px;font-size:11.5px;color:var(--text-faint);">Error al buscar.</div>`; return; }
      if(!results.length){ suggestionsBox.innerHTML = `<div style="padding:8px 10px;font-size:11.5px;color:var(--text-faint);">Sin resultados.</div>`; return; }
      suggestionsBox.innerHTML = results.map((r,i) => `<button type="button" class="ticker-suggestion" data-idx="${i}">
        <b>${r.symbol}</b> — ${r.name}${r.exchange?` <span style="color:var(--text-faint);">(${r.exchange})</span>`:''}
      </button>`).join('');
      suggestionsBox.querySelectorAll('.ticker-suggestion').forEach(btn => btn.addEventListener('mousedown', (e) => {
        e.preventDefault();
        const r = results[Number(btn.getAttribute('data-idx'))];
        addPositionSelected = r;
        addPositionCompanyInfo = null;
        tickerInput.value = r.symbol;
        const nameInput = document.getElementById('addpos-name');
        if(nameInput && !nameInput.value.trim()) nameInput.value = r.name;
        const marketSelect = document.getElementById('addpos-market');
        if(marketSelect){ const m = marketForTicker(r.symbol, r.exchange); if(m) marketSelect.value = m; }
        suggestionsBox.innerHTML = '';
        const symbol = r.symbol;
        callEdgeFunction('company-info', {ticker: symbol}).then(info => {
          if(addPositionSelected !== r) return; // el usuario ya eligió otro ticker
          if(!info || !info.ok) return;
          addPositionCompanyInfo = info;
          const sectorSelect = document.getElementById('addpos-sector');
          if(sectorSelect && !sectorSelect.value){
            const guess = sectorForCompany(info.sector, info.industry);
            if(guess) sectorSelect.value = guess;
          }
        }).catch(() => {});
      }));
    }, 300);
  });
  tickerInput.addEventListener('blur', () => {
    setTimeout(() => { if(suggestionsBox) suggestionsBox.innerHTML = ''; }, 150);
  });

  const submitBtn = document.getElementById('addpos-submit');
  if(submitBtn) submitBtn.addEventListener('click', async () => {
    const ticker = tickerInput.value.trim().toUpperCase();
    const name = document.getElementById('addpos-name').value.trim();
    const market = document.getElementById('addpos-market').value;
    const sector = document.getElementById('addpos-sector').value;
    const tier = document.getElementById('addpos-tier').value;
    const invested = num(document.getElementById('addpos-invested').value);
    const price = num(document.getElementById('addpos-price').value);
    const commission = num(document.getElementById('addpos-commission').value);
    const date = document.getElementById('addpos-date').value;
    const horizon = document.getElementById('addpos-horizon').value.trim();

    const showAddPosError = (msg) => {
      addPositionError = msg;
      const errEl = document.getElementById('addpos-error');
      if(errEl){ errEl.textContent = msg; errEl.style.display = 'block'; }
    };
    if(!name){ showAddPosError('Falta el nombre.'); return; }
    if(!market){ showAddPosError('Elige un mercado.'); return; }
    if(!sector){ showAddPosError('Elige un sector.'); return; }
    if(invested===null || invested<=0){ showAddPosError('Indica el importe invertido.'); return; }

    const row = {
      id: crypto.randomUUID(),
      portfolio_id: portfolioId,
      name,
      ticker: ticker || null,
      market,
      sector,
      tier: tier || null,
      invested,
      price,
      commission,
      purchase_date: date || null,
      horizon: horizon || null,
      currency: currencyForTicker(ticker),
      pending_investment: TIER_PENDING_INVESTMENT[tier] || 750,
    };
    if(addPositionCompanyInfo && addPositionSelected && addPositionSelected.symbol === ticker){
      row.business_summary = addPositionCompanyInfo.summary || null;
      row.business_summary_source = addPositionCompanyInfo.source || null;
    }
    const { error } = await supabase.from('positions').insert(row);
    if(error){ showAddPosError('Error al guardar — revisa la conexión.'); return; }
    addPositionOpen = false;
    markDirty();
    await loadAll();
    showStatus(`Posición "${name}" añadida.`);
    render(currentScenario);
  });
}

function teardownStockFinderOutsideClose(){
  if(stockFinderOutsideCloseHandler){
    document.removeEventListener('click', stockFinderOutsideCloseHandler);
    stockFinderOutsideCloseHandler = null;
  }
}

function wireStockFinderModal(app){
  const btn = document.getElementById('stock-finder-btn');
  if(btn) btn.addEventListener('click', (e) => {
    e.stopPropagation();
    stockFinderOpen = true;
    render(currentScenario);
    if(!stockFinderOutsideCloseHandler){
      stockFinderOutsideCloseHandler = (ev) => {
        const root = document.getElementById('stockfinder-root');
        if(root && root.contains(ev.target)) return;
        teardownStockFinderOutsideClose();
        stockFinderOpen = false;
        render(currentScenario);
      };
      document.addEventListener('click', stockFinderOutsideCloseHandler);
    }
  });

  if(!stockFinderOpen) return;
  const closeIt = () => { teardownStockFinderOutsideClose(); stockFinderOpen = false; render(currentScenario); };
  const closeBtn = document.getElementById('stockfinder-close');
  if(closeBtn) closeBtn.addEventListener('click', (e) => { e.stopPropagation(); closeIt(); });

  const input = document.getElementById('stockfinder-input');
  if(input){
    input.focus();
    input.addEventListener('click', (e) => e.stopPropagation());
    const suggestionsBox = document.getElementById('stockfinder-suggestions');
    let searchTimer = null;
    input.addEventListener('input', () => {
      const q = input.value.trim();
      if(searchTimer) clearTimeout(searchTimer);
      if(q.length < 2){ suggestionsBox.innerHTML = ''; return; }
      searchTimer = setTimeout(async () => {
        const token = ++stockFinderSearchToken;
        suggestionsBox.innerHTML = `<div style="padding:8px 10px;font-size:11.5px;color:var(--text-faint);">Buscando…</div>`;
        let results = [];
        try {
          const res = await callEdgeFunction('ticker-search', {q});
          results = (res && res.ok) ? res.results : [];
        } catch(e){ results = null; }
        if(token !== stockFinderSearchToken) return;
        if(results === null){ suggestionsBox.innerHTML = `<div style="padding:8px 10px;font-size:11.5px;color:var(--text-faint);">Error al buscar.</div>`; return; }
        if(!results.length){ suggestionsBox.innerHTML = `<div style="padding:8px 10px;font-size:11.5px;color:var(--text-faint);">Sin resultados.</div>`; return; }
        suggestionsBox.innerHTML = results.map((r,i) => `<button type="button" class="ticker-suggestion" data-idx="${i}">
          <b>${r.symbol}</b> — ${r.name}${r.exchange?` <span style="color:var(--text-faint);">(${r.exchange})</span>`:''}
        </button>`).join('');
        suggestionsBox.querySelectorAll('.ticker-suggestion').forEach(sbtn => sbtn.addEventListener('mousedown', (e) => {
          e.preventDefault();
          const r = results[Number(sbtn.getAttribute('data-idx'))];
          teardownStockFinderOutsideClose();
          stockFinderOpen = false;
          currentScreen = 'visor';
          selectStockViewerTicker(r.symbol);
        }));
      }, 300);
    });
  }
}

function wireMenu(app){

  if(logoBtn) logoBtn.addEventListener('click', async (e) => { e.stopPropagation(); await goHome(); });
  app.querySelectorAll('.nav-item').forEach(btn=>btn.addEventListener('click', async (e) => {

    const view = btn.getAttribute('data-view');

    if(view === 'carteras'){

      render(null);
    } else {
      activeView = view;
      render(currentScenario);

  }));
  const menuLogoutBtn = document.getElementById('menu-logout-btn');

}

        render(currentScenario);
      }
    });
  }

  app.querySelectorAll('.home-portfolio-rename').forEach(btn=>btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const id = btn.getAttribute('data-id'), name = btn.getAttribute('data-name');
    openCardMenu = null;
    askPrompt('Editar nombre', 'Nombre de la cartera', async (value) => {
      await supabase.from('portfolios').update({ name: value }).eq('id', id);
      if(portfolioId === id) activePortfolioName = value;
      await loadPortfolios();
      render(null);
    }, name);
  }));

  app.querySelectorAll('.home-portfolio-describe').forEach(btn=>btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const id = btn.getAttribute('data-id'), description = btn.getAttribute('data-description');
    openCardMenu = null;
    askPrompt('Editar descripción', 'Descripción breve de la cartera', async (value) => {
      await supabase.from('portfolios').update({ description: value || null }).eq('id', id);
      await loadPortfolios();
      render(null);
    }, description, { maxLength:60, allowEmpty:true, confirmLabel:'Guardar' });
  }));

  app.querySelectorAll('.home-portfolio-share-btn').forEach(btn=>btn.addEventListener('click', async (e) => {
    e.stopPropagation();
    const id = btn.getAttribute('data-id');
    const nextShared = btn.getAttribute('data-shared') !== '1';
    await supabase.from('portfolios').update({ shared: nextShared }).eq('id', id);
    await loadPortfolios();
    render(null);
  }));

  app.querySelectorAll('.home-portfolio-category-select').forEach(sel=>{
    sel.addEventListener('click', e => e.stopPropagation());
    sel.addEventListener('change', async (e) => {
      const id = sel.getAttribute('data-id');
      await supabase.from('portfolios').update({ category: sel.value || null }).eq('id', id);
      await loadPortfolios();
      render(null);
    });
  });

  app.querySelectorAll('.home-portfolio-delete').forEach(btn=>btn.addEventListener('click', (e) => {
    e.stopPropagation();
    openCardMenu = null;
    if(portfolios.length <= 1){ showStatus('No puedes eliminar tu única cartera.'); render(currentScenario); return; }
    const id = btn.getAttribute('data-id'), name = btn.getAttribute('data-name');
    askConfirm('Eliminar cartera', `¿Eliminar "${name}"? Sus posiciones dejarán de verse (se puede recuperar más adelante).`, async () => {
      const target = portfolios.find(p=>p.id===id);
      if(target) await supabase.from('deleted_items_log').insert({ item_type:'portfolio', item_id:id, snapshot:target });
      await supabase.from('portfolios').update({ deleted_at: new Date().toISOString() }).eq('id', id);
      await loadPortfolios();
      render(null);
    }, { danger:true, confirmLabel:'Eliminar' });
  }));

  const createCard = document.getElementById('home-create-card');
  if(createCard) createCard.addEventListener('click', () => {
    askPrompt('Nueva cartera', 'Nombre de la cartera', async (name) => {
      const { data, error } = await supabase.from('portfolios').insert({ name }).select('id').single();
      if(error){ showStatus('Error al crear la cartera.'); render(currentScenario); return; }
      portfolioId = data.id;
      activePortfolioName = name;
      currentScreen = 'portfolio';
      selectedId = null;
      diversificationFilter = null;
      document.getElementById('app').innerHTML = 'Cargando…';
      await loadAll();
      render(null);
      autoUpdateQuotes();
    });
  });

  wireViewOverlay(app);
}

        </div>

    : (!allRulesData || !allRulesData.length) ? `<div style="font-size:12.5px;color:var(--text-faint);padding:8px 0;">Todavía no tienes reglas. Abre una posición dentro de una cartera y usa "+ Añadir regla".</div>`
    : `<div style="display:flex;flex-direction:column;gap:24px;max-width:760px;">
        ${matched.length ? `<div>
          <div style="font-size:11px;color:var(--accent-text);text-transform:uppercase;letter-spacing:.04em;font-weight:700;margin-bottom:10px;">⚠ Reglas activas ahora (${matched.length})</div>
          <div style="display:flex;flex-direction:column;gap:8px;">${matched.map(ruleRow).join('')}</div>

          <div style="font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;font-weight:700;margin-bottom:10px;">Resto de reglas (${rest.length})</div>

      </div>
      ${accountSection}
      <div style="margin-bottom:14px;">
        <h2 style="font-family:'Calibri','Carlito',sans-serif;font-weight:600;font-size:16px;margin:0;">Mis reglas</h2>
        <div style="font-size:11.5px;color:var(--text-faint);margin-top:2px;">Añade reglas desde el detalle de cada posición. Aquí verás cuáles están activas ahora mismo.</div>
      </div>
      ${body}
    </div>
    ${renderViewOverlay()}
    ${renderDialog()}
    ${renderStatusToast()}
  </div>`;

  wireMenu(app);
  wireDialog(app);
  wireStockFinderModal(app);
  wireViewOverlay(app);

  const accountThemeBtn = document.getElementById('account-theme-toggle');

    theme = theme === 'dark' ? 'light' : 'dark';
    localStorage.setItem('ps_theme', theme);
    document.documentElement.setAttribute('data-theme', theme);
    render(currentScenario);
  });
  app.querySelectorAll('[data-profile-field]').forEach(el => {
    const evt = el.tagName === 'SELECT' ? 'change' : 'blur';
    el.addEventListener(evt, async () => {
      const field = el.getAttribute('data-profile-field');
      const value = el.value.trim() ? el.value.trim() : null;
      const statusEl = document.getElementById('profile-save-status');
      if(statusEl) statusEl.textContent = 'Guardando…';
      const { error } = await supabase.from('profiles').upsert({ [field]: value });
      if(error){ if(statusEl) statusEl.textContent = 'Error al guardar.'; return; }
      profile = { ...(profile||{}), [field]: value };
      if(statusEl) statusEl.textContent = 'Guardado.';
    });
  });

  app.querySelectorAll('.global-rule-delete-btn').forEach(btn=>btn.addEventListener('click', async () => {
    const id = btn.getAttribute('data-id');
    await supabase.from('rules').delete().eq('id', id);
    await loadAllRulesData();
    render(null);
  }));
}

function wireScreenerBuilder(app){
  if(!screenerBuilderOpen) return;
  const closeIt = () => { screenerBuilderOpen = false; render(null); };
  const closeBtn = document.getElementById('screener-builder-close');
  if(closeBtn) closeBtn.addEventListener('click', closeIt);
  const cancelBtn = document.getElementById('screener-builder-cancel');
  if(cancelBtn) cancelBtn.addEventListener('click', closeIt);
  const backdrop = document.getElementById('screener-builder-backdrop');
  if(backdrop) backdrop.addEventListener('click', (e) => { if(e.target===backdrop) closeIt(); });

  const showErr = (msg) => {
    screenerBuilderError = msg;
    const el = document.getElementById('screener-builder-error');
    if(el){ el.textContent = msg; el.style.display = 'block'; }
  };

  app.querySelectorAll('.screener-cond-metric').forEach(sel => sel.addEventListener('change', () => {
    screenerBuilderConditions[Number(sel.getAttribute('data-idx'))].metric = sel.value;
  }));
  app.querySelectorAll('.screener-cond-operator').forEach(sel => sel.addEventListener('change', () => {
    screenerBuilderConditions[Number(sel.getAttribute('data-idx'))].operator = sel.value;
  }));
  app.querySelectorAll('.screener-cond-value').forEach(inp => inp.addEventListener('input', () => {
    screenerBuilderConditions[Number(inp.getAttribute('data-idx'))].value = inp.value;
  }));
  app.querySelectorAll('.screener-cond-remove').forEach(btn => btn.addEventListener('click', () => {
    screenerBuilderConditions.splice(Number(btn.getAttribute('data-idx')), 1);
    render(null);
  }));

  const addBtn = document.getElementById('screener-cond-add');
  if(addBtn) addBtn.addEventListener('click', () => {
    screenerBuilderConditions.push({metric:'rsi14', operator:'lt', value:30});
    render(null);
  });

  const saveBtn = document.getElementById('screener-builder-save');
  if(saveBtn) saveBtn.addEventListener('click', async () => {
    const nameInput = document.getElementById('screener-builder-name');
    const name = nameInput.value.trim();
    if(!name){ showErr('Falta el nombre.'); return; }
    if(!screenerBuilderConditions.length){ showErr('Añade al menos una condición.'); return; }
    for(const c of screenerBuilderConditions){
      if(c.value===''||c.value===null||isNaN(num(c.value))){ showErr('Todas las condiciones necesitan un valor numérico.'); return; }
    }
    const { data: screener, error } = await supabase.from('screeners').insert({ name }).select().single();
    if(error){ showErr('Error al guardar — revisa la conexión.'); return; }
    const rows = screenerBuilderConditions.map(c => ({ screener_id: screener.id, metric: c.metric, operator: c.operator, value: num(c.value) }));
    const { error: condErr } = await supabase.from('screener_conditions').insert(rows);
    if(condErr){ showErr('Error al guardar las condiciones.'); return; }
    screenerBuilderOpen = false;
    await loadScreeners();
    render(null);
  });
}

function avPct(v){ return v==null ? '—' : (v>=0?'+':'')+(v*100).toFixed(1)+'%'; }
function avRatio(v, suffix){ return v==null ? '—' : v.toFixed(2)+(suffix||'x'); }
function avNum(v, decimals){ return v==null ? '—' : v.toFixed(decimals==null?2:decimals); }
function fmtMarketCap(v, currency){
  if(v==null) return '—';
  const cur = currency||'';
  if(v>=1e9) return (v/1e9).toLocaleString('es-ES',{maximumFractionDigits:2})+' B '+cur;
  if(v>=1e6) return (v/1e6).toLocaleString('es-ES',{maximumFractionDigits:2})+' M '+cur;
  return v.toLocaleString('es-ES')+' '+cur;
}

function drawStockViewerChart(points, dividends, weeklyPoints, maSelection){
  const closes = points.map(p=>p.c);
  const w=900,h=260,padL=58,padR=14,padT=14,padB=24;

  // Las medias móviles se piden en semanas (10/50/200), pero el precio se
  // dibuja en escala diaria (últimos 2 años). Se calcula cada media sobre el
  // cierre semanal (hasta 5 años de histórico) y se proyecta sobre cada día
  // usando la última semana ya cerrada en esa fecha.
  const maLines = [];
  if(weeklyPoints && weeklyPoints.length && maSelection){
    const weeklyCloses = weeklyPoints.map(p=>p.c);
    MA_WEEK_OPTIONS.forEach(opt => {
      if(!maSelection[opt.key]) return;
      const smaWeekly = computeSMA(weeklyCloses, opt.weeks);
      const mapped = [];
      let wi = 0;
      points.forEach(pt => {
        const t = new Date(pt.t).getTime();
        while(wi+1 < weeklyPoints.length && new Date(weeklyPoints[wi+1].t).getTime() <= t) wi++;
        const wt = new Date(weeklyPoints[wi].t).getTime();
        mapped.push(wt<=t ? smaWeekly[wi] : null);
      });
      maLines.push({ color: opt.color, values: mapped });
    });
  }

  const allVals = closes.concat(maLines.flatMap(m=>m.values.filter(v=>v!=null)));
  const min=Math.min.apply(null,allVals), max=Math.max.apply(null,allVals);
  const range=(max-min)||Math.max(min,1)*0.05||1;
  const lo=min-range*0.08, hi=max+range*0.08, r2=(hi-lo)||1;
  const x = i => padL + (points.length<=1?0:(i/(points.length-1))*(w-padL-padR));
  const y = v => h-padB - ((v-lo)/r2)*(h-padT-padB);
  const lineOf = (arr) => arr.map((v,i)=> v==null?null:((i===0||arr[i-1]==null?'M':'L')+x(i)+','+y(v))).filter(Boolean).join(' ');
  const priceLine = points.map((pt,i)=>(i===0?'M':'L')+x(i)+','+y(closes[i])).join(' ');
  const area = priceLine + ` L${x(points.length-1)},${h-padB} L${x(0)},${h-padB} Z`;
  const up = closes[closes.length-1] >= closes[0];
  const color = up ? '#4ADE80' : '#F87171';

  const yTickN = 5;
  const yGrid = Array.from({length:yTickN}, (_,i) => {
    const v = min + (max-min)*i/(yTickN-1);
    const yy = y(v);
    return `<line x1="${padL}" y1="${yy}" x2="${w-padR}" y2="${yy}" stroke="#26282D" stroke-width="1"/>
      <text x="${padL-8}" y="${yy+3}" font-size="9.5" fill="#6E7177" font-family="Calibri,Carlito,sans-serif" text-anchor="end">${v.toFixed(2)}</text>`;
  }).join('');

  const xTickN = Math.min(6, points.length);
  const xIdx = xTickN<=1 ? [0] : Array.from({length:xTickN}, (_,i)=>Math.round(i*(points.length-1)/(xTickN-1)));
  const xGrid = [...new Set(xIdx)].map(i => {
    const xx = x(i);
    const d = new Date(points[i].t);
    return `<line x1="${xx}" y1="${padT}" x2="${xx}" y2="${h-padB}" stroke="#212327" stroke-width="1"/>
      <text x="${xx}" y="${h-6}" font-size="9" fill="#6E7177" font-family="Calibri,Carlito,sans-serif" text-anchor="middle">${d.toLocaleDateString('es-ES',{month:'short',year:'2-digit'})}</text>`;
  }).join('');

  const firstT = new Date(points[0].t).getTime();
  const lastT = new Date(points[points.length-1].t).getTime();
  const divMarkers = (dividends||[]).map(d => {
    const t = new Date(d.date).getTime();
    if(isNaN(t) || t<firstT || t>lastT) return '';
    let nearest = 0, best = Infinity;
    for(let i=0;i<points.length;i++){
      const diff = Math.abs(new Date(points[i].t).getTime()-t);
      if(diff<best){ best=diff; nearest=i; }
    }
    const xx = x(nearest);
    return `<g>
      <line x1="${xx}" y1="${padT}" x2="${xx}" y2="${h-padB}" stroke="#4ADE80" stroke-width="1" stroke-dasharray="2,3" opacity="0.55"/>
      <circle cx="${xx}" cy="${padT+4}" r="3" fill="#4ADE80"/>
      <title>Dividendo · ${d.date}${d.amount!=null?' · '+d.amount:''}</title>
    </g>`;
  }).join('');

  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:100%;display:block;">
    <defs><linearGradient id="areaFillVisor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    ${xGrid}
    ${yGrid}
    <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${h-padB}" stroke="#2D2F35" stroke-width="1"/>
    <path d="${area}" fill="url(#areaFillVisor)"/>
    ${maLines.map(m=>`<path d="${lineOf(m.values)}" fill="none" stroke="${m.color}" stroke-width="1.3"/>`).join('')}
    <path d="${priceLine}" fill="none" stroke="${color}" stroke-width="1.8"/>
    <circle cx="${x(points.length-1)}" cy="${y(closes[closes.length-1])}" r="3" fill="${color}"/>
    ${divMarkers}
  </svg>`;
}

                <td style="padding:6px 8px;text-align:right;">${e.epsEstimate!=null?avNum(e.epsEstimate):'—'}</td>
                <td style="padding:6px 8px;text-align:right;">${e.revenueEstimate!=null?fmtMarketCap(e.revenueEstimate, q?q.currency:''):'—'}</td>
                <td style="padding:6px 0 6px 8px;text-align:right;color:var(--text-faint);">${e.analystCount!=null?Math.round(e.analystCount):'—'}</td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>` : ''}
    </div>`;
  }

  app.innerHTML = `<div class="home-wrap" style="flex:1;min-height:0;overflow-y:auto;box-sizing:border-box;padding:16px 0 32px;">
    <div style="max-width:1200px;margin:0 auto;padding:0 32px;box-sizing:border-box;">
      ${topNavBar()}
      <div style="margin-bottom:22px;">
        <h1 style="font-family:'Calibri','Carlito',sans-serif;font-weight:600;font-size:26px;margin:0 0 14px;">Visor de acciones</h1>
        <div style="position:relative;max-width:420px;">
          <input id="stockviewer-input" placeholder="Busca un ticker: AAPL, SAN.MC, 7203.T…" value="${stockViewerQuery.replace(/"/g,'&quot;')}" autocomplete="off" style="width:100%;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;padding:10px 14px;box-sizing:border-box;"/>
          <div id="stockviewer-suggestions" style="position:absolute;top:100%;left:0;right:0;background:var(--panel);border:1px solid var(--border);border-radius:6px;box-shadow:0 12px 32px rgba(0,0,0,0.25);z-index:10;overflow:hidden;margin-top:4px;"></div>
        </div>
      </div>
      ${body}
    </div>
    ${renderViewOverlay()}
    ${renderDialog()}
    ${renderStatusToast()}
  </div>`;

  wireMenu(app);
  wireDialog(app);
  wireStockFinderModal(app);
  wireViewOverlay(app);

  const input = document.getElementById('stockviewer-input');
  const suggestionsBox = document.getElementById('stockviewer-suggestions');
  let searchTimer = null;
  if(input) input.addEventListener('input', () => {
    stockViewerQuery = input.value;
    const query = input.value.trim();
    if(searchTimer) clearTimeout(searchTimer);
    if(query.length < 2){ suggestionsBox.innerHTML = ''; return; }
    searchTimer = setTimeout(async () => {
      const token = ++stockViewerSearchToken;
      suggestionsBox.innerHTML = `<div style="padding:8px 10px;font-size:11.5px;color:var(--text-faint);">Buscando…</div>`;
      let results = [];
      try {
        const res = await callEdgeFunction('ticker-search', {q: query});
        results = (res && res.ok) ? res.results : [];
      } catch(e){ results = null; }
      if(token !== stockViewerSearchToken) return;
      if(results === null){ suggestionsBox.innerHTML = `<div style="padding:8px 10px;font-size:11.5px;color:var(--text-faint);">Error al buscar.</div>`; return; }
      if(!results.length){ suggestionsBox.innerHTML = `<div style="padding:8px 10px;font-size:11.5px;color:var(--text-faint);">Sin resultados.</div>`; return; }
      suggestionsBox.innerHTML = results.map((r,i) => `<button type="button" class="ticker-suggestion" data-idx="${i}">
        <b>${r.symbol}</b> — ${r.name}${r.exchange?` <span style="color:var(--text-faint);">(${r.exchange})</span>`:''}
      </button>`).join('');
      suggestionsBox.querySelectorAll('.ticker-suggestion').forEach(btn => btn.addEventListener('mousedown', (e) => {
        e.preventDefault();
        const r = results[Number(btn.getAttribute('data-idx'))];
        suggestionsBox.innerHTML = '';
        selectStockViewerTicker(r.symbol);
      }));
    }, 300);
  });
  if(input) input.addEventListener('blur', () => {
    setTimeout(() => { if(suggestionsBox) suggestionsBox.innerHTML = ''; }, 150);
  });
  if(input) input.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){
      e.preventDefault();
      const val = input.value.trim().toUpperCase();
      if(val){ suggestionsBox.innerHTML = ''; selectStockViewerTicker(val); }
    }
  });

  app.querySelectorAll('.ma-toggle-btn').forEach(btn => btn.addEventListener('click', () => {
    const key = btn.getAttribute('data-key');
    stockViewerMASelection[key] = !stockViewerMASelection[key];
    render(null);
  }));

  const visorAddBtn = document.getElementById('visor-addpos-btn');
  if(visorAddBtn) visorAddBtn.addEventListener('click', async (e) => {
    e.stopPropagation();
    visorAddPickerOpen = !visorAddPickerOpen;
    if(visorAddPickerOpen){
      render(null);
      await loadPortfolios();
      render(null);
      if(!visorAddPickerOutsideCloseHandler){
        visorAddPickerOutsideCloseHandler = (ev) => {
          const panel = document.getElementById('visor-addpos-panel');
          const btn2 = document.getElementById('visor-addpos-btn');
          if((panel && panel.contains(ev.target)) || (btn2 && btn2.contains(ev.target))) return;
          document.removeEventListener('click', visorAddPickerOutsideCloseHandler);
          visorAddPickerOutsideCloseHandler = null;
          visorAddPickerOpen = false;
          render(null);
        };
        document.addEventListener('click', visorAddPickerOutsideCloseHandler);
      }
    } else {
      if(visorAddPickerOutsideCloseHandler){
        document.removeEventListener('click', visorAddPickerOutsideCloseHandler);
        visorAddPickerOutsideCloseHandler = null;
      }
      render(null);
    }
  });

  app.querySelectorAll('.visor-portfolio-btn').forEach(pbtn => pbtn.addEventListener('click', async () => {
    const pf = portfolios.find(x=>x.id === pbtn.getAttribute('data-id'));
    if(!pf) return;
    if(visorAddPickerOutsideCloseHandler){
      document.removeEventListener('click', visorAddPickerOutsideCloseHandler);
      visorAddPickerOutsideCloseHandler = null;
    }
    visorAddPickerOpen = false;
    const sel = { symbol: stockViewerTicker, name: q ? q.name : stockViewerTicker, exchange: q ? q.exchange : null };
    portfolioId = pf.id;
    activePortfolioName = pf.name;
    currentScreen = 'portfolio';
    await loadAll();
    addPositionOpen = true; addPositionError = null; addPositionCompanyInfo = null;
    addPositionSelected = sel;
    render(null);
    const marketSelect = document.getElementById('addpos-market');
    if(marketSelect){ const m = marketForTicker(sel.symbol, sel.exchange); if(m) marketSelect.value = m; }
    callEdgeFunction('company-info', {ticker: sel.symbol}).then(info => {
      if(addPositionSelected !== sel) return;
      if(!info || !info.ok) return;
      addPositionCompanyInfo = info;
      const sectorSelect = document.getElementById('addpos-sector');
      if(sectorSelect && !sectorSelect.value){
        const guess = sectorForCompany(info.sector, info.industry);
        if(guess) sectorSelect.value = guess;
      }
    }).catch(() => {});
  }));
}

function render(scenario){
  if(!session) return; // una operación asíncrona pendiente terminó después de cerrar sesión; no repintar la app
  if(currentScreen === 'explorar'){
    renderExploreScreen();
    return;
  }
  if(currentScreen === 'cuenta'){
    renderAccountScreen();
    return;
  }
  if(currentScreen === 'screeners'){
    renderScreenersScreen();
    return;
  }
  if(currentScreen === 'visor'){
    renderStockViewerScreen();
    return;
  }
  if(currentScreen !== 'portfolio'){
    renderHomeScreen();
    return;
  }
  currentScenario = scenario;
  const app = document.getElementById('app');
  const totals = computeTotals();
  const cagr = computeCAGR(totals);
  const conc = computeConcentration(totals);
  const pendingInvestTotal = portfolio.positions.reduce((sum,p) => sum + pendingInvestmentFor(p), 0);
  const estimatedTotal = totals.value + pendingInvestTotal;
  let html = '';

  html += `<div class="pf-wrap" style="flex:1;min-height:0;display:flex;flex-direction:column;box-sizing:border-box;padding:0 32px;">
    <div style="max-width:1200px;width:100%;margin:0 auto;flex:1;min-height:0;display:flex;flex-direction:column;">`;

  html += topNavBar();

  html += `<div class="pf-header" style="display:flex;flex-direction:column;gap:14px;flex-shrink:0;margin-bottom:16px;">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;">
      <h1 style="font-family:'Calibri','Carlito',sans-serif;font-weight:600;font-size:20px;margin:0;white-space:nowrap;flex-shrink:0;">${esc(activePortfolioName)}</h1>
      <div class="pf-controls" style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;">
        <select id="scenario-select" class="pill-select" style="border:1px solid ${scenario?'var(--accent-border)':'var(--border)'};background:${scenario?'var(--accent-soft)':'var(--panel-2)'};color:${scenario?'var(--accent-text)':'var(--text-dim)'};max-width:180px;font-size:10.5px;">
          <option value="">Posibles escenarios</option>
          ${SCENARIOS.map(sc=>`<option value="${sc.key}" ${scenario===sc.key?'selected':''}>${sc.label}</option>`).join('')}
        </select>
        <button id="portfolio-news-btn" class="pill-btn" style="border:1px solid var(--border);background:var(--panel-2);color:var(--text-dim);white-space:nowrap;">Noticias de mi cartera</button>
        <button id="addpos-btn" class="pill-btn" style="border:1px solid var(--border);background:var(--panel-2);color:var(--text-dim);white-space:nowrap;">+ Añadir posición</button>
      </div>
    </div>
    <div class="pf-kpis" style="display:flex;justify-content:space-evenly;align-items:center;flex-wrap:wrap;gap:16px 20px;min-width:0;background:var(--panel-2);border:1px solid var(--border-soft);border-radius:12px;padding:14px 22px;">
      ${kpiBlock('Invertido', fmtEUR(totals.invested))}
      ${kpiBlock('Valor actual', fmtEUR(totals.value))}
      ${kpiBlock('Ganancia', (totals.gain>=0?'+':'')+fmtEUR(totals.gain), totals.gain>=0?'var(--green)':'var(--red)')}
      ${kpiBlock('Ganancia %', (totals.gainPct>=0?'+':'')+fmtPct(totals.gainPct), totals.gainPct>=0?'var(--green)':'var(--red)')}
      ${kpiBlock('Posiciones', totals.withData+' / '+totals.total)}
      ${kpiBlock('Comisiones broker', fmtEUR(totals.commission))}
      ${kpiBlock('Rentab. anual.', cagr.value===null?'—':(cagr.value>=0?'+':'')+fmtPct(cagr.value), cagr.value===null?'var(--text-dim)':(cagr.value>=0?'var(--green)':'var(--red)'), cagr.value===null ? `Necesita al menos 30 días de historial desde la primera compra (llevas ${cagr.days}).` : `CAGR desde la primera compra, hace ${cagr.days} días.`)}
      ${kpiBlock('Concentración', conc.name?Math.round(conc.pct)+'%':'—', null, conc.name ? `Tu posición mayor es ${conc.name}, con el ${Math.round(conc.pct)}% del valor actual de la cartera.` : '')}
      ${kpiBlock('Pdt. invertir', fmtEUR(pendingInvestTotal), null, 'Suma del campo "Pendiente invertir" de cada posición — cantidad planeada para seguir invirtiendo, no dinero ya invertido.')}
      ${kpiBlock('Total cartera estimado', fmtEUR(estimatedTotal), null, 'Valor actual + lo pendiente de invertir en todas las posiciones — una proyección, no el valor real de hoy.')}
    </div>
  </div>

  <div class="pf-charts-row" style="display:flex;gap:10px;flex-shrink:0;height:clamp(110px,18vh,180px);margin-bottom:10px;">
    <div class="pf-chart" style="flex:2.2;min-width:0;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:10px 16px;box-sizing:border-box;">
      ${drawChart()}
    </div>
    <div class="pf-donut" style="flex:0.9;min-width:0;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:8px 10px;box-sizing:border-box;display:flex;flex-direction:column;">
      <div style="font-size:9px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;flex-shrink:0;">Por mercado</div>
      <div style="flex:1;min-height:0;">${drawDiversification(breakdownByWeight(p=>p.market), k=>MARKET[k]?.color||'#6E7177', k=>MARKET[k]?.label||k, 5, fundedDetail(p=>p.market), 'market')}</div>
    </div>
    <div class="pf-donut" style="flex:0.9;min-width:0;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:8px 10px;box-sizing:border-box;display:flex;flex-direction:column;">
      <div style="font-size:9px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;flex-shrink:0;">Por sector</div>
      <div style="flex:1;min-height:0;">${drawDiversification(breakdownByWeight(p=>p.sector), sectorColor, k=>k, 6, fundedDetail(p=>p.sector), 'sector')}</div>
    </div>
  </div>

  ${diversificationFilter ? `<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:11px;color:var(--text-dim);flex-shrink:0;">
    Filtrando tabla por <b style="color:var(--text);">${diversificationFilter.type==='market' ? (MARKET[diversificationFilter.key]?.label||diversificationFilter.key) : diversificationFilter.key}</b>
    <button id="clear-filter-btn" style="cursor:pointer;background:var(--panel-2);border:1px solid var(--border);color:var(--text-dim);border-radius:10px;padding:1px 9px;font-size:10px;">Quitar filtro ✕</button>
  </div>` : ''}

  ${renderPositionsTable(scenario)}
    </div>
  </div>

  ${renderModal()}
  ${renderAddPositionModal()}
  ${renderPortfolioNewsModal()}
  ${renderViewOverlay()}
  ${renderDialog()}
  ${renderStatusToast()}`;

  app.innerHTML = html;

  app.querySelectorAll('.pf-card[data-id]').forEach(t=>t.addEventListener('click',()=>{
    selectedId = t.getAttribute('data-id');
    modalRange = 'mes';
    modalChartState = {loading:true, error:null, points:null};
    const pos = portfolio.positions.find(p=>p.id===selectedId);
    if(pos && pos.business_summary){
      modalCompanyState = {loading:false, error:null, summary:pos.business_summary, source:pos.business_summary_source};
    } else if(pos && pos.ticker){
      modalCompanyState = {loading:true, error:null, summary:null};
    } else {
      modalCompanyState = {loading:false, error:null, summary:null};
    }
    ruleFormOpen = false; ruleFormError = null; positionRules = []; positionRulesLoading = true;
    render(currentScenario);
    if(pos && pos.ticker) loadModalChart(pos.ticker, modalRange);
    if(pos && pos.ticker && !pos.business_summary) loadModalCompanyInfo(pos);
    loadPositionRules(selectedId).then(() => render(currentScenario));
  }));

  const sel = document.getElementById('scenario-select');
  if(sel) sel.addEventListener('change', () => render(sel.value || null));

  app.querySelectorAll('.div-slice').forEach(el=>el.addEventListener('click',()=>{
    const type = el.getAttribute('data-type'), key = el.getAttribute('data-key');
    if(key==='__otros__') return;
    if(diversificationFilter && diversificationFilter.type===type && diversificationFilter.key===key){
      diversificationFilter = null;
    } else {
      diversificationFilter = {type, key};
    }
    render(currentScenario);
  }));

  const clearFilterBtn = document.getElementById('clear-filter-btn');
  if(clearFilterBtn) clearFilterBtn.addEventListener('click', () => { diversificationFilter = null; render(currentScenario); });

  app.querySelectorAll('.range-btn').forEach(b=>b.addEventListener('click',()=>{
    modalRange = b.getAttribute('data-range');
    modalChartState = {loading:true, error:null, points:null};
    render(currentScenario);
    const pos = portfolio.positions.find(p=>p.id===selectedId);
    if(pos && pos.ticker) loadModalChart(pos.ticker, modalRange);
  }));

  const closeBtn = document.getElementById('modal-close');
  if(closeBtn) closeBtn.addEventListener('click', () => { selectedId = null; modalChartToken++; modalCompanyToken++; ruleFormOpen = false; ruleFormError = null; render(currentScenario); });
  const backdrop = document.getElementById('modal-backdrop');
  if(backdrop) backdrop.addEventListener('click', (e) => { if(e.target===backdrop){ selectedId = null; modalChartToken++; modalCompanyToken++; ruleFormOpen = false; ruleFormError = null; render(currentScenario); } });

  const ruleAddToggle = document.getElementById('rule-add-toggle');
  if(ruleAddToggle) ruleAddToggle.addEventListener('click', () => {
    ruleFormOpen = !ruleFormOpen; ruleFormError = null;
    render(currentScenario);
  });
  const ruleSaveBtn = document.getElementById('rule-save-btn');
  if(ruleSaveBtn) ruleSaveBtn.addEventListener('click', async () => {
    const pos = portfolio.positions.find(p=>p.id===selectedId);
    if(!pos) return;
    const metric = document.getElementById('rule-metric').value;
    const operator = document.getElementById('rule-operator').value;
    const threshold = num(document.getElementById('rule-threshold').value);
    const action = document.getElementById('rule-action').value;
    const note = document.getElementById('rule-note').value.trim();
    if(threshold===null){ ruleFormError = 'Introduce un umbral numérico.'; render(currentScenario); return; }
    const { error } = await supabase.from('rules').insert({
      portfolio_id: portfolioId, position_id: pos.id, ticker: pos.ticker || null, position_name: pos.name,
      metric, operator, threshold, action, note: note || null
    });
    if(error){ ruleFormError = 'No se pudo guardar la regla.'; render(currentScenario); return; }
    ruleFormOpen = false; ruleFormError = null;
    await loadPositionRules(selectedId);
    render(currentScenario);
  });
  app.querySelectorAll('.rule-delete-btn').forEach(btn=>btn.addEventListener('click', async () => {
    const id = btn.getAttribute('data-id');
    await supabase.from('rules').delete().eq('id', id);
    await loadPositionRules(selectedId);
    render(currentScenario);
  }));

  const deleteBtn = document.getElementById('modal-delete');
  if(deleteBtn) deleteBtn.addEventListener('click', () => {
    const pos = portfolio.positions.find(p=>p.id===selectedId);
    if(!pos) return;
    askConfirm('Eliminar posición', `¿Eliminar "${pos.name}"? Se puede recuperar más adelante.`, async () => {
      await supabase.from('deleted_items_log').insert({ item_type:'position', item_id:pos.id, snapshot:pos });
      await supabase.from('positions').update({ deleted_at: new Date().toISOString() }).eq('id', pos.id);
      selectedId = null; modalChartToken++; modalCompanyToken++;
      markDirty();
      await loadAll();
      showStatus(`Posición "${pos.name}" eliminada.`);
      render(currentScenario);
    }, { danger:true, confirmLabel:'Eliminar' });
  });

  app.querySelectorAll('input[data-field], textarea[data-field]').forEach(el=>{
    el.addEventListener('blur', async () => {
      const id = el.getAttribute('data-id'), field = el.getAttribute('data-field');
      const isNumeric = field==='invested'||field==='price'||field==='commission'||field==='pending_investment';
      const value = isNumeric ? num(el.value) : el.value;
      const ok = await updatePositionField(id, field, value);
      const pos = portfolio.positions.find(p=>p.id===id);
      if(pos && ok) pos[field] = value;
      if(ok && (field==='invested'||field==='price')) markDirty();
      if(!ok) showStatus('Error al guardar — revisa la conexión.');
      render(currentScenario);
    });
  });

  const addPosBtn = document.getElementById('addpos-btn');
  if(addPosBtn) addPosBtn.addEventListener('click', () => {
    addPositionOpen = true; addPositionError = null; addPositionSelected = null; addPositionCompanyInfo = null;
    render(currentScenario);
  });
  wireAddPositionModal(app);

  const portfolioNewsBtn = document.getElementById('portfolio-news-btn');
  if(portfolioNewsBtn) portfolioNewsBtn.addEventListener('click', async () => {
    portfolioNewsOpen = true;
    render(currentScenario);
    await loadPortfolioNews();
    render(currentScenario);
  });
  const portfolioNewsClose = document.getElementById('portfolio-news-close');
  if(portfolioNewsClose) portfolioNewsClose.addEventListener('click', () => { portfolioNewsOpen = false; render(currentScenario); });
  const portfolioNewsBackdrop = document.getElementById('portfolio-news-backdrop');
  if(portfolioNewsBackdrop) portfolioNewsBackdrop.addEventListener('click', (e) => { if(e.target===portfolioNewsBackdrop){ portfolioNewsOpen = false; render(currentScenario); } });

  wireMenu(app);
  wireDialog(app);
  wireStockFinderModal(app);

  wireViewOverlay(app);
}

      ${!isSignup ? `<div style="text-align:right;margin-bottom:16px;"><button type="button" id="auth-forgot-btn" style="cursor:pointer;background:none;border:none;color:var(--text-faint);font-size:12px;padding:0;">¿Olvidaste tu contraseña?</button></div>` : '<div style="margin-bottom:16px;"></div>'}
      ${msgBlock}
      <button type="submit" class="pill-btn" style="width:100%;border:1px solid var(--accent-border);background:var(--accent-soft);color:var(--accent-text);padding:13px;font-size:15px;font-weight:600;" ${loginBusy?'disabled':''}>${loginBusy?(isSignup?'Creando…':'Entrando…'):(isSignup?'Crear cuenta':'Entrar')}</button>
      <div style="text-align:center;margin-top:16px;font-size:12.5px;color:var(--text-faint);">${isSignup?'¿Ya tienes cuenta?':'¿No tienes cuenta?'} <button type="button" id="auth-switch-btn" style="cursor:pointer;background:none;border:none;color:var(--accent-text);font-size:12.5px;padding:0;font-weight:600;">${isSignup?'Entrar':'Crear una'}</button></div>`;
